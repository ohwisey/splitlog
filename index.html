    // Backfill: write a past session into SESSION + COMPLETED + HISTORY + HISTLOG.
    // Used when the user wants to import workouts they did before installing the app.
    function saveBackfillEntry(exId, dayNum, date, topWeight, topReps, totalSets) {
      if (!exId || !date || !topWeight || !topReps) return false;
      const sets = [];
      for (let i = 0; i < (totalSets || 1); i++) {
        sets.push({ wt: topWeight, reps: topReps, done: true, missed: false });
      }
      const sessionData = { [exId]: { sets } };
      try {
        // Merge into existing session for that date if one already exists (e.g. user
        // backfilled another exercise on the same day — preserve those sets).
        const existing = (() => {
          try { return JSON.parse(localStorage.getItem(SESSION_PREFIX + date + '.' + dayNum) || '{}'); } catch { return {}; }
        })();
        const merged = { ...existing, ...sessionData };
        tryWrite(SESSION_PREFIX + date + '.' + dayNum, JSON.stringify(merged));
        tryWrite(COMPLETED_PREFIX + date + '.' + dayNum, JSON.stringify({ date, snapshot: merged, backfill: true }));
      } catch (e) {
        console.warn('backfill save failed:', e);
        return false;
      }
      // Update HISTLOG (replace if entry exists for that date)
      const log = getHistoryLog(exId);
      const volume = Math.round(topWeight * topReps * (totalSets || 1));
      const idx = log.findIndex(en => en.date === date);
      const entry = { date, topWeight, topReps, volume };
      if (idx >= 0) log[idx] = entry; else log.push(entry);
      log.sort((a, b) => a.date.localeCompare(b.date));
      saveHistoryLog(exId, log.slice(-500));
      // Promote HISTORY only if backfill date is newer than current snapshot
      const currentH = getHistory(exId);
      if (!currentH || date >= currentH.date) {
        saveHistory(exId, { date, sets, topWeight, topReps });
      }
      return true;
    }

    function openBackfillForm(exId, dayNum) {
      const ex = EX[exId];
      if (!ex) return;
      // Local-date formatter — toISOString() returns UTC which can drift the date
      // by 1 day for users in any non-UTC timezone (especially West-of-UTC after
      // afternoon, East-of-UTC overnight).
      const fmtLocal = (d) =>
        d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const today = new Date();
      const todayStr = fmtLocal(today);
      const defaultDate = (() => {
        const d = new Date(today); d.setDate(d.getDate() - 7);
        return fmtLocal(d);
      })();
      const tailor = tailorEstimate(exId);
      const wtHint = tailor != null && tailor > 0 ? `~${tailor}` : 'kg';
      openPopover(`
        <div class="popover-title">Add past session</div>
        <div class="popover-ex-name">${esc(ex.name)}</div>
        <div class="popover-tip">Backfill from old notes. The chart, history list and warmup all pull from this just like a fresh log.</div>
        <div class="bf-form">
          <div class="bf-row">
            <label>Date</label>
            <input type="date" id="bf-date" value="${defaultDate}" max="${todayStr}" />
          </div>
          <div class="bf-row">
            <label>Top weight</label>
            <input type="text" inputmode="decimal" id="bf-weight" placeholder="${wtHint}" />
            <span class="bf-unit">${isPerDb(exId) ? 'kg ea' : 'kg'}</span>
          </div>
          <div class="bf-row">
            <label>Top reps</label>
            <input type="text" inputmode="numeric" id="bf-reps" placeholder="5" />
          </div>
          <div class="bf-row">
            <label>Sets done</label>
            <input type="text" inputmode="numeric" id="bf-sets" placeholder="4" value="4" />
          </div>
          <button class="bf-save" id="bf-save">Add to history</button>
        </div>
      `);
      document.getElementById('bf-save').addEventListener('click', () => {
        const date = document.getElementById('bf-date').value;
        const wt = parseFloat(document.getElementById('bf-weight').value);
        const reps = parseInt(document.getElementById('bf-reps').value, 10);
        const sets = parseInt(document.getElementById('bf-sets').value, 10) || 1;
        if (!date || !wt || !reps) {
          document.getElementById(!date ? 'bf-date' : !wt ? 'bf-weight' : 'bf-reps').focus();
          return;
        }
        const ok = saveBackfillEntry(exId, dayNum, date, wt, reps, sets);
        if (ok) openSessionListPopover(exId, dayNum);
      });
    }

    function openSessionListPopover(exId, dayNum) {
      const ex = EX[exId];
      if (!ex) return;
      const histlog = getDayHistory(exId, dayNum);
      if (!histlog.length) {
        openPopover(`
          <div class="popover-title">Past sessions</div>
          <div class="popover-ex-name">${esc(ex.name)}</div>
          <div class="popover-tip">No sessions logged on this day yet. Once you submit a workout, every past entry shows up here with full set details.</div>
          <button class="bf-open-btn" id="bf-open">+ Add past session (backfill)</button>
        `);
        document.getElementById('bf-open').addEventListener('click', () => openBackfillForm(exId, dayNum));
        return;
      }
      // newest first
      const sessions = histlog.slice().reverse().map(entry => {
        let sets = [];
        try {
          const sess = JSON.parse(localStorage.getItem(SESSION_PREFIX + entry.date + '.' + dayNum) || '{}');
          sets = (sess[exId] && sess[exId].sets) || [];
        } catch (_) {}
        return { date: entry.date, sets, topWeight: entry.topWeight, topReps: entry.topReps, volume: entry.volume };
      });

      const sessionCards = sessions.map((s, i) => {
        const setRows = s.sets.length ? s.sets.map((set, idx) => {
          const wt = (set.wt !== undefined && set.wt !== '') ? set.wt : '—';
          const reps = (set.reps !== undefined && set.reps !== '') ? set.reps : '—';
          const statusGlyph = set.missed ? '✗' : (set.done ? '✓' : '·');
          const statusCls = set.missed ? 'missed' : (set.done ? 'done' : 'incomplete');
          return `
            <div class="sess-set">
              <span class="sess-set-num">${idx + 1}</span>
              <span class="sess-set-wt">${fmtKg(wt, exId)}</span>
              <span class="sess-set-reps">× ${esc(String(reps))}</span>
              <span class="sess-set-status ${statusCls}">${statusGlyph}</span>
            </div>`;
        }).join('') : '<div class="sess-set-empty">No per-set data.</div>';
        const topLine = `${fmtKg(s.topWeight, exId)} × ${s.topReps}`;
        return `
          <div class="sess-card${i === 0 ? ' latest' : ''}">
            <div class="sess-card-header">
              <span class="sess-card-date">${formatHistDate(s.date)}${i === 0 ? ' · latest' : ''}</span>
              <span class="sess-card-top">${topLine}</span>
            </div>
            <div class="sess-card-sets">${setRows}</div>
          </div>`;
      }).join('');

      openPopover(`
        <div class="popover-title">Past sessions</div>
        <div class="popover-ex-name">${esc(ex.name)}</div>
        <button class="bf-open-btn" id="bf-open">+ Add past session (backfill)</button>
        <div class="sess-list">${sessionCards}</div>
      `);
      document.getElementById('bf-open').addEventListener('click', () => openBackfillForm(exId, dayNum));
    }

    function openRestEditPopover(exId, dayNum) {
      const ex = EX[exId];
      const split = getSplit() || [];
      const dayConfig = split[dayNum - 1];
      if (!dayConfig) return;
      const entry = (dayConfig.exercises || []).find(x => x.id === exId);
      if (!entry) return;
      const dayType = dayConfig.type;
      const defaultRest = optimalRestFor(exId, dayType);

      const PRESETS = [45, 60, 90, 120, 150, 180, 210, 240];

      function render() {
        const current = entry.rest || defaultRest;
        const isCustom = !!entry.rest && entry.rest !== defaultRest;
        const dayLabel = tagLabel(dayType).toLowerCase();
        const chipsHTML = PRESETS.map(s => {
          const active = (s === current) ? ' active' : '';
          const isDefault = (s === defaultRest) ? ' default' : '';
          return `<button class="rest-edit-chip${active}${isDefault}" data-rest-set="${s}">${formatRest(s)}</button>`;
        }).join('');
        openPopover(`
          <div class="popover-title">Rest between sets</div>
          <div class="popover-ex-name">${esc(ex ? ex.name : exId)}</div>
          <div class="rest-edit-display">
            <div class="rest-edit-current">${formatRest(current)}</div>
            <div class="rest-edit-default-note">${isCustom ? `Custom · default ${formatRest(defaultRest)} for ${esc(dayLabel)} days` : `Default for ${esc(dayLabel)} days`}</div>
          </div>
          <div class="rest-edit-chips">${chipsHTML}</div>
          <div class="rest-edit-actions">
            <button class="rest-edit-step" data-rest-delta="-15">− 15s</button>
            <button class="rest-edit-step" data-rest-delta="15">+ 15s</button>
          </div>
          ${isCustom ? `<button class="rest-edit-reset" id="rest-edit-reset">Reset to default (${formatRest(defaultRest)})</button>` : ''}
        `);
        function commit(newVal) {
          const v = Math.max(15, Math.min(600, newVal));
          if (v === defaultRest) delete entry.rest;
          else entry.rest = v;
          saveSplit(split);
          renderSplit();
          render();
        }
        document.querySelectorAll('[data-rest-delta]').forEach(b => {
          b.addEventListener('click', () => commit((entry.rest || defaultRest) + parseInt(b.dataset.restDelta, 10)));
        });
        document.querySelectorAll('[data-rest-set]').forEach(b => {
          b.addEventListener('click', () => commit(parseInt(b.dataset.restSet, 10)));
        });
        const resetBtn = document.getElementById('rest-edit-reset');
        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            delete entry.rest;
            saveSplit(split);
            renderSplit();
            render();
          });
        }
      }
      render();
    }

    function openSwapPopover(dayNum, slotExId) {
      const slotEx = EX[slotExId];
      const split = getSplit();
      const day = split && split[dayNum - 1];
      const slot = day && (day.exercises || []).find(e => e.id === slotExId);
      if (!slotEx || !day || !slot) return;
      const sess = getSession(dayNum);
      const currentSwap = (sess._swaps || {})[slotExId];
      const currentSwapEx = currentSwap ? EX[currentSwap] : null;

      const hist = getHistory(slotExId);
      const baseWt = (slot.defaultWeight != null && slot.defaultWeight !== '')
        ? parseFloat(slot.defaultWeight)
        : (hist && hist.topWeight ? parseFloat(hist.topWeight) : 0);

      const alts = ALTS[slotExId] || [];
      const altRows = alts.map(a => {
        const altEx = EX[a.id];
        if (!altEx) return '';
        const projected = baseWt > 0 && a.wtRatio > 0
          ? roundHalf(baseWt * a.wtRatio)
          : null;
        const wtStr = projected
          ? `≈ ${fmtKg(projected, a.id)}`
          : (a.wtRatio === 0 ? 'BW / set load' : '—');
        const active = a.id === currentSwap ? ' active' : '';
        return `<button class="alt-row${active}" data-alt="${a.id}" data-wt="${projected || ''}">
          <div class="alt-info">
            <div class="alt-name">${esc(altEx.name)}</div>
            <div class="alt-meta">${altEx.sets} × ${esc(altEx.reps)}</div>
          </div>
          <div class="alt-wt">${wtStr}</div>
        </button>`;
      }).join('');

      const revertHTML = currentSwap
        ? `<button class="alt-revert" id="alt-revert">↺ Revert to ${esc(slotEx.name)}</button>`
        : '';
      const noteHTML = currentSwap
        ? `<div class="popover-note">Today only — doing <strong style="color:#6ee7b7;">${esc(currentSwapEx?.name || currentSwap)}</strong> instead. Tap another to change, or revert below. Sets count toward the substitute's history.</div>`
        : `<div class="popover-note">Different gym or kit today? Pick a substitute — sets save to that exercise's history. Swap is one-day only; tomorrow's session returns to the original. ${baseWt > 0 ? `Weight auto-scales from ${fmtKg(baseWt, slotExId)}.` : ''}</div>`;

      openPopover(`
        <div class="popover-title">Swap for today</div>
        <div class="popover-ex-name">${esc(slotEx.name)}</div>
        ${noteHTML}
        ${revertHTML}
        ${altRows || '<div class="popover-tip">No alternatives mapped for this lift yet.</div>'}
      `);

      document.querySelectorAll('.alt-row').forEach(row => {
        row.addEventListener('click', () => {
          const newId = row.dataset.alt;
          if (isSessionLocked(dayNum)) return;
          const fresh = getSession(dayNum);
          fresh._swaps = fresh._swaps || {};
          const prevSwap = fresh._swaps[slotExId];
          // Clear any data we'd written under the previous swap target or the slot itself
          if (prevSwap && prevSwap !== newId) delete fresh[prevSwap];
          if (newId === slotExId) {
            delete fresh._swaps[slotExId]; // tapping the slot's own ex = revert
          } else {
            fresh._swaps[slotExId] = newId;
            delete fresh[slotExId]; // sets that were under the slot id move out of the way
          }
          if (fresh._swaps && Object.keys(fresh._swaps).length === 0) delete fresh._swaps;
          saveSession(dayNum, fresh);
          closePopover();
          renderSplit();
        });
      });
      const revertBtn = document.getElementById('alt-revert');
      if (revertBtn) revertBtn.addEventListener('click', () => {
        if (isSessionLocked(dayNum)) return;
        const fresh = getSession(dayNum);
        const prevSwap = fresh._swaps && fresh._swaps[slotExId];
        if (prevSwap) delete fresh[prevSwap];
        if (fresh._swaps) {
          delete fresh._swaps[slotExId];
          if (Object.keys(fresh._swaps).length === 0) delete fresh._swaps;
        }
        saveSession(dayNum, fresh);
        closePopover();
        renderSplit();
      });
    }

    function openHistoryPopover(exId, dayNum) {
      const ex = EX[exId];
      if (!ex) return;
      const log = getDayHistory(exId, dayNum);

      // Empty state — no entries for this day-type yet
      if (!log.length) {
        openPopover(`
          <div class="popover-title">History · Top weight</div>
          <div class="popover-ex-name">${esc(ex.name)}</div>
          <div class="popover-tip">No sessions logged on this day yet. Submit a workout — the graph builds rotation over rotation.</div>
        `);
        return;
      }

      // Stats
      const weights = log.map(e => e.topWeight);
      const peak    = Math.max(...weights);
      const avg     = Math.round((weights.reduce((s, w) => s + w, 0) / weights.length) * 10) / 10;
      const first   = log[0];
      const latest  = log[log.length - 1];
      const delta   = (latest.topWeight - first.topWeight);
      const deltaStr = delta > 0 ? `+${delta}` : `${delta}`;
      const trendColor = delta > 0 ? '#6ee7b7' : (delta < 0 ? '#f87171' : 'rgba(255,255,255,0.5)');

      // Chart geometry
      const W = 320, H = 130, PADX = 26, PADY = 18;
      const minW = Math.min(...weights);
      const maxW = peak;
      const range = Math.max(maxW - minW, 1);
      const xStep = log.length > 1 ? (W - 2 * PADX) / (log.length - 1) : 0;
      const yFor = w => H - PADY - ((w - minW) / range) * (H - 2 * PADY);
      const xFor = i => PADX + i * xStep;
      const pts = log.map((e, i) => `${xFor(i)},${yFor(e.topWeight)}`).join(' ');
      const yMax = yFor(maxW), yMin = yFor(minW);
      const guides = `
        <line x1="${PADX}" y1="${yMax}" x2="${W - PADX}" y2="${yMax}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 3"/>
        <line x1="${PADX}" y1="${yMin}" x2="${W - PADX}" y2="${yMin}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 3"/>
        <text x="${PADX - 4}" y="${yMax + 4}" text-anchor="end" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Inter">${maxW}</text>
        <text x="${PADX - 4}" y="${yMin + 4}" text-anchor="end" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Inter">${minW}</text>
      `;
      const dateLabels = log.length > 1
        ? `<text x="${PADX}" y="${H - 2}" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Inter">${formatHistDate(first.date)}</text>
           <text x="${W - PADX}" y="${H - 2}" text-anchor="end" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Inter">${formatHistDate(latest.date)}</text>`
        : '';

      // Default-selected index = latest
      const startIdx = log.length - 1;

      // Trend-aware colors: up = mint glow, down = soft red, flat = neutral mint
      const isUp   = delta > 0;
      const isDown = delta < 0;
      const lineColor = isDown ? '#f87171' : '#6ee7b7';

      // Closed path beneath the polyline for the gradient fill
      const fillPts = log.map((e, i) => `${xFor(i)},${yFor(e.topWeight)}`);
      const fillPathD = log.length > 1
        ? `M ${fillPts[0]} L ${fillPts.slice(1).join(' L ')} L ${xFor(log.length - 1)},${H - PADY} L ${xFor(0)},${H - PADY} Z`
        : '';

      // Trend-dependent glow intensities — tight inner + soft outer for quality, no screen flood
      const innerOpacity = isUp ? 0.95 : (isDown ? 0 : 0.3);
      const outerOpacity = isUp ? 0.55 : (isDown ? 0 : 0.18);
      const dots = log.map((e, i) => {
        const isLatest = i === log.length - 1;
        return `<circle class="hist-dot${isLatest && isUp ? ' hist-dot-latest' : ''}" data-i="${i}" cx="${xFor(i)}" cy="${yFor(e.topWeight)}" r="3.5" fill="${lineColor}" ${isLatest && isUp ? `filter="url(#hist-dot-glow)"` : ''}/>`;
      }).join('');

      const chartSVG = `<svg id="hist-chart" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"
        style="display:block;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:crosshair;touch-action:none;overflow:visible;">
        <defs>
          <linearGradient id="hist-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="${lineColor}" stop-opacity="${isUp ? 0.55 : 0.20}"/>
            <stop offset="45%"  stop-color="${lineColor}" stop-opacity="${isUp ? 0.18 : 0.06}"/>
            <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
          </linearGradient>
          <!-- Quality two-pass line glow: tight inner halo + soft outer bloom -->
          <filter id="hist-line-glow" x="-12%" y="-12%" width="124%" height="124%">
            <!-- Inner tight glow -->
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="innerBlur"/>
            <feFlood flood-color="${lineColor}" flood-opacity="${innerOpacity}" result="innerColor"/>
            <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
            <!-- Outer soft bloom -->
            <feGaussianBlur in="SourceAlpha" stdDeviation="3.6" result="outerBlur"/>
            <feFlood flood-color="${lineColor}" flood-opacity="${outerOpacity}" result="outerColor"/>
            <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
            <feMerge>
              <feMergeNode in="outerGlow"/>
              <feMergeNode in="innerGlow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <!-- Latest-dot glow: tighter, color-tinted -->
          <filter id="hist-dot-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="dotBlur"/>
            <feFlood flood-color="${lineColor}" flood-opacity="${isUp ? 0.85 : 0.35}" result="dotColor"/>
            <feComposite in="dotColor" in2="dotBlur" operator="in" result="dotGlow"/>
            <feMerge>
              <feMergeNode in="dotGlow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <!-- Indicator-dot soft halo (always on) -->
          <filter id="hist-indicator-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="indBlur"/>
            <feFlood flood-color="${lineColor}" flood-opacity="0.7" result="indColor"/>
            <feComposite in="indColor" in2="indBlur" operator="in" result="indGlow"/>
            <feMerge>
              <feMergeNode in="indGlow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        ${guides}
        ${log.length > 1 ? `<path d="${fillPathD}" fill="url(#hist-fill-grad)" />` : ''}
        ${log.length > 1 ? `<polyline fill="none" stroke="${lineColor}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${pts}" filter="url(#hist-line-glow)"/>` : ''}
        ${dots}
        ${dateLabels}
        <line id="hist-indicator-line" x1="${xFor(startIdx)}" y1="${PADY}" x2="${xFor(startIdx)}" y2="${H - PADY - 4}"
              stroke="rgba(110,231,183,0.75)" stroke-width="1.2"
              stroke-dasharray="1 3.5" stroke-linecap="round" />
        <circle id="hist-indicator-dot" cx="${xFor(startIdx)}" cy="${yFor(log[startIdx].topWeight)}"
                r="5.5" fill="${lineColor}" stroke="rgba(0,0,0,0.85)" stroke-width="1.5"
                filter="url(#hist-indicator-glow)" />
      </svg>`;

      const statsRow = `
        <div style="display:flex;justify-content:space-between;gap:10px;margin:10px 0;font-feature-settings:'tnum';">
          <div style="flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;">
            <div style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Sessions</div>
            <div style="font-size:16px;font-weight:600;color:#fff;margin-top:2px;">${log.length}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;">
            <div style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Avg</div>
            <div style="font-size:16px;font-weight:600;color:#fff;margin-top:2px;">${fmtKg(avg, exId)}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;">
            <div style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Peak</div>
            <div style="font-size:16px;font-weight:600;color:#6ee7b7;margin-top:2px;">${fmtKg(peak, exId)}</div>
          </div>
          <div style="flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;">
            <div style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.4);">Δ</div>
            <div style="font-size:16px;font-weight:600;color:${trendColor};margin-top:2px;">${deltaStr}kg</div>
          </div>
        </div>`;

      const dragHint = log.length > 1 ? '<div class="hist-drag-hint">Drag the chart to scrub through past sessions</div>' : '';

      openPopover(`
        <div class="popover-title">History · Top weight</div>
        <div class="popover-ex-name">${esc(ex.name)}</div>
        ${chartSVG}
        <div class="hist-readout" id="hist-readout"></div>
        ${dragHint}
        ${statsRow}
      `);

      // ── Interactive scrub ────────────────────────────────────────────────
      const chartEl = document.getElementById('hist-chart');
      const lineEl  = document.getElementById('hist-indicator-line');
      const dotEl   = document.getElementById('hist-indicator-dot');
      const readEl  = document.getElementById('hist-readout');

      function updateAt(idx) {
        idx = Math.max(0, Math.min(log.length - 1, idx));
        const entry = log[idx];
        const x = xFor(idx);
        const y = yFor(entry.topWeight);
        lineEl.setAttribute('x1', x);
        lineEl.setAttribute('x2', x);
        dotEl.setAttribute('cx', x);
        dotEl.setAttribute('cy', y);
        const sessionLabel = log.length > 1
          ? `Session ${idx + 1} of ${log.length}`
          : 'Only session';
        readEl.innerHTML = `
          <div class="hist-readout-left">
            <div class="hist-readout-session">${sessionLabel}</div>
            <div class="hist-readout-date">${esc(formatHistDate(entry.date))}</div>
          </div>
          <div class="hist-readout-right">
            <div class="hist-readout-wt">${fmtKg(entry.topWeight, exId)} × ${entry.topReps}</div>
            <div class="hist-readout-vol">vol ${entry.volume || 0}</div>
          </div>`;
      }

      function scrubFrom(clientX) {
        const rect = chartEl.getBoundingClientRect();
        const xInView = ((clientX - rect.left) / rect.width) * W;
        const chartW = W - 2 * PADX;
        if (chartW <= 0) return;
        const pct = Math.max(0, Math.min(1, (xInView - PADX) / chartW));
        const idx = Math.round(pct * (log.length - 1));
        updateAt(idx);
      }

      let dragging = false;
      chartEl.addEventListener('pointerdown', e => {
        dragging = true;
        chartEl.setPointerCapture && chartEl.setPointerCapture(e.pointerId);
        scrubFrom(e.clientX);
      });
      chartEl.addEventListener('pointermove', e => {
        if (dragging) scrubFrom(e.clientX);
      });
      chartEl.addEventListener('pointerup', e => {
        dragging = false;
        chartEl.releasePointerCapture && chartEl.releasePointerCapture(e.pointerId);
      });
      chartEl.addEventListener('pointercancel', () => { dragging = false; });

      // Default state: latest entry
      updateAt(startIdx);
    }

    function roundHalf(n) {
      // Round to nearest 0.5 (gym plate-friendly for DBs); 2.5 for ≥30kg
      if (n >= 30) return Math.round(n * 2 / 5) * 2.5;
      return Math.round(n * 2) / 2;
    }

    // ── Wizard (multi-step modal) ──────────────────────────────────────────
    // step: 'split' → editing days   |   { day: idx }  → exercise picker for that day
    let wizState = {
      mode: 'split',           // 'split' or 'exercises'
      step: 0,                 // 0 = split editor; 1..N = day N exercises
      draft: [],               // split draft
      activePresetKey: null,
      exDayIdx: 0,             // index of day being edited in exercises mode
      singleDayMode: false,    // true when opened to edit one specific day's exercises
    };

    function openSplitEditor() {
      const current = getSplit();
      // No current split → start the wizard with an empty draft so the user
      // picks a preset card or hits "+ Add day". (Used to fall back to the
      // 8-day preset, which no longer exists.)
      wizState.draft = current ? JSON.parse(JSON.stringify(current)) : [];
      wizState.draft = wizState.draft.map(d => ({
        name: d.name || 'Day',
        type: d.type || 'HEAVY',
        category: d.category || detectCategory(d.name, d.type),
        exercises: d.exercises || [],
      }));
      wizState.activePresetKey = matchPreset(wizState.draft);
      wizState.mode = 'split';
      wizState.singleDayMode = false;
      renderWizard();
      document.getElementById('edit-modal').classList.add('open');
    }

    function openExerciseWizard(dayNum) {
      const current = getSplit() || [];
      wizState.draft = current.map(d => ({ ...d, exercises: (d.exercises || []).slice() }));
      wizState.mode = 'exercises';
      wizState.exDayIdx = dayNum - 1;
      wizState.singleDayMode = true;
      renderWizard();
      document.getElementById('edit-modal').classList.add('open');
    }

    function closeWizard() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    function matchPreset(days) {
      for (const key of Object.keys(PRESETS)) {
        const p = PRESETS[key].days;
        if (p.length !== days.length) continue;
        const same = p.every((d, i) => d.name === days[i].name && d.type === days[i].type);
        if (same) return key;
      }
      return null;
    }

    function renderWizard() {
      const sheet = document.getElementById('modal-sheet');
      if (wizState.mode === 'split') {
        sheet.innerHTML = renderSplitEditorHTML();
        attachSplitEditorHandlers();
      } else {
        sheet.innerHTML = renderExercisePickerHTML();
        attachExercisePickerHandlers();
      }
    }

    // ── Split editor (step 1) ──────────────────────────────────────────────
    function renderSplitEditorHTML() {
      const presets = Object.entries(PRESETS).map(([key, p]) => {
        const active = key === wizState.activePresetKey ? ' active' : '';
        return `<button class="preset-card${active}" data-preset="${key}">
          <div class="preset-name">${esc(p.name)}</div>
          <div class="preset-meta">${esc(p.meta)}</div>
        </button>`;
      }).join('');

      const dayRows = wizState.draft.map((d, i) => {
        const n = String(i + 1).padStart(2, '0');
        const opts = TAG_OPTIONS.map(o =>
          `<option value="${o.value}"${o.value === d.type ? ' selected' : ''}>${o.label}</option>`
        ).join('');
        return `<div class="edit-day-row" data-idx="${i}">
          <span class="edit-day-num">Day ${n}</span>
          <input class="edit-day-name" data-idx="${i}" type="text" value="${esc(d.name)}" placeholder="Day name" />
          <select class="edit-day-tag" data-idx="${i}">${opts}</select>
          <button class="edit-day-remove" data-idx="${i}" title="Remove">×</button>
        </div>`;
      }).join('');

      return `
        <div class="modal-title">Customize your split</div>
        <div class="modal-sub">Pick a preset or build your own. Tag each day <strong>heavy</strong> or <strong>volume</strong> — rest times auto-tune (compounds 3:30 / 2:30, isolations 1:15 / 1:00). Exercises auto-fill from the day name.</div>

        <div class="section-label">Presets</div>
        <div class="preset-grid" id="preset-grid">${presets}</div>

        <div class="section-label">Your days <span class="section-label-hint">name · heavy/volume/rest · remove</span></div>
        <div id="edit-day-list">${dayRows}</div>
        <button class="add-day-btn" id="add-day-btn">+ Add day</button>

        <div class="modal-actions">
          <button class="modal-btn-cancel" id="modal-cancel">Cancel</button>
          <button class="modal-btn-save" id="modal-next">Save & lock</button>
        </div>
      `;
    }

    function attachSplitEditorHandlers() {
      document.getElementById('preset-grid').querySelectorAll('.preset-card').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.preset;
          wizState.draft = JSON.parse(JSON.stringify(PRESETS[key].days)).map(d => ({
            ...d,
            category: d.category || detectCategory(d.name, d.type),
            exercises: [],
          }));
          wizState.activePresetKey = key;
          renderWizard();
        });
      });

      document.querySelectorAll('.edit-day-name').forEach(inp => {
        inp.addEventListener('input', e => {
          const i = +e.target.dataset.idx;
          wizState.draft[i].name = e.target.value;
          wizState.draft[i].category = detectCategory(e.target.value, wizState.draft[i].type);
          wizState.activePresetKey = matchPreset(wizState.draft);
          syncPresetActive();
        });
      });
      document.querySelectorAll('.edit-day-tag').forEach(sel => {
        sel.addEventListener('change', e => {
          const i = +e.target.dataset.idx;
          wizState.draft[i].type = e.target.value;
          wizState.draft[i].category = detectCategory(wizState.draft[i].name, e.target.value);
          wizState.activePresetKey = matchPreset(wizState.draft);
          syncPresetActive();
        });
      });
      document.querySelectorAll('.edit-day-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          if (wizState.draft.length <= 1) {
            alert('Keep at least one day in your split.');
            return;
          }
          wizState.draft.splice(+btn.dataset.idx, 1);
          wizState.activePresetKey = matchPreset(wizState.draft);
          renderWizard();
        });
      });

      document.getElementById('add-day-btn').addEventListener('click', () => {
        wizState.draft.push({ name: `Day ${wizState.draft.length + 1}`, type: 'HEAVY', category: 'full', exercises: [] });
        wizState.activePresetKey = matchPreset(wizState.draft);
        renderWizard();
      });
      document.getElementById('modal-cancel').addEventListener('click', closeWizard);
      document.getElementById('modal-next').addEventListener('click', () => {
        // Clean draft + auto-fill recommended exercises for any day that has none
        wizState.draft = wizState.draft.map(d => {
          const name = (d.name || '').trim() || 'Untitled';
          const type = d.type || 'HEAVY';
          const category = d.category || detectCategory(name, type);
          let exercises = d.exercises || [];
          if (!exercises.length && category !== 'rest') {
            exercises = (RECOMMENDED[category] || []).map(id => ({ id }));
          }
          return { name, type, category, exercises };
        });
        finalizeSplitSave();
      });
    }

    function syncPresetActive() {
      document.querySelectorAll('.preset-card').forEach(c => {
        c.classList.toggle('active', c.dataset.preset === wizState.activePresetKey);
      });
    }

    // ── Exercise picker (step 2+) ──────────────────────────────────────────
    function renderExercisePickerHTML() {
      const day = wizState.draft[wizState.exDayIdx];
      const cat = day.category || 'full';
      const group = CATEGORY_GROUPS[cat] || CATEGORY_GROUPS.full;
      const picked = new Set((day.exercises || []).map(e => e.id));

      const pickedMap = {};
      (day.exercises || []).forEach(e => { pickedMap[e.id] = e; });

      // Merge any user-added customs scoped to this category
      const customs = loadCustomEx().filter(c => c.category === cat);
      const customCompoundIds = customs.filter(c => c.group === 'compounds').map(c => c.id);
      const customIsolationIds = customs.filter(c => c.group === 'isolation').map(c => c.id);
      const customIdSet = new Set([...customCompoundIds, ...customIsolationIds]);

      const compoundsHTML = renderExGroupHTML('compounds', 'Compounds', [...group.compounds, ...customCompoundIds], picked, pickedMap, cat, customIdSet);
      const isolationHTML = renderExGroupHTML('isolation', 'Isolation / extensions', [...group.isolation, ...customIsolationIds], picked, pickedMap, cat, customIdSet);
      // Abs / core — always offered as a third group on every non-rest, non-abs
      // workout day so any split (push/pull/legs/upper/lower/etc.) can stack
      // core work without changing the day name to "Pull + Abs". Skipped when
      // the day IS already abs-focused (the isolation group already shows them).
      const absIds = (cat !== 'abs' && CATEGORY_GROUPS.abs) ? CATEGORY_GROUPS.abs.isolation : [];
      const absHTML = absIds.length
        ? renderExGroupHTML('abs', 'Abs / Core', absIds, picked, pickedMap, cat, new Set())
        : '';

      // Step progress
      const nonRest = wizState.draft.filter(d => d.category !== 'rest');
      const nonRestIdxs = wizState.draft.map((d, i) => d.category !== 'rest' ? i : -1).filter(i => i >= 0);
      const stepNum = nonRestIdxs.indexOf(wizState.exDayIdx) + 1;
      const stepTotal = nonRest.length;
      const isLast = stepNum === stepTotal;

      const dayN = String(wizState.exDayIdx + 1).padStart(2, '0');
      const stepLabel = wizState.singleDayMode
        ? 'Edit exercises'
        : `Step 2 of 2 · Day ${stepNum} of ${stepTotal}`;

      return `
        <div class="step-progress">${esc(stepLabel)}</div>
        <div class="wiz-day-header">
          <div class="wiz-day-name">${esc(day.name)}</div>
          <div class="wiz-day-meta">Day ${dayN} · ${esc(group.label)} · ${tagLabel(day.type)}</div>
        </div>

        ${compoundsHTML}
        ${isolationHTML}
        ${absHTML}

        ${(group.compounds.length + group.isolation.length === 0) ? '<div class="ex-empty-note">No recommended exercises for this category. Set day name to push / pull / legs / upper / lower / chest / back / shoulders / arms / full body to get suggestions.</div>' : ''}

        <div class="modal-actions">
          <button class="modal-btn-back" id="wiz-prev">${wizState.singleDayMode ? 'Cancel' : '← Back'}</button>
          <button class="modal-btn-cancel" id="wiz-autofill">Auto-fill recommended</button>
          <button class="modal-btn-save" id="wiz-next">${wizState.singleDayMode ? 'Save' : (isLast ? 'Save & lock' : 'Next day →')}</button>
        </div>
      `;
    }

    function renderExGroupHTML(key, label, ids, pickedSet, pickedMap, cat, customIdSet) {
      // Always render at least the label + add-custom row, even if no built-ins
      ids = ids || [];
      customIdSet = customIdSet || new Set();
      const pickedCount = ids.filter(id => pickedSet.has(id)).length;
      const rows = ids.map(id => {
        const ex = EX[id];
        if (!ex) return '';
        const isPicked = pickedSet.has(id);
        const selected = isPicked ? ' selected' : '';
        const isCustom = customIdSet.has(id);
        const picked = pickedMap[id] || {};
        const defaultWtVal = (picked.defaultWeight != null && picked.defaultWeight !== '')
          ? picked.defaultWeight
          : '';
        const hist = getHistory(id);
        const tailorEst = tailorEstimate(id);
        const wtPlaceholder = (hist && hist.topWeight) ? String(hist.topWeight)
                            : (tailorEst != null && tailorEst > 0) ? String(tailorEst)
                            : '—';
        const weightUnit = isPerDb(id) ? 'kg ea' : 'kg';
        const weightInputHTML = isPicked ? `
          <div class="edit-ex-weight">
            <label>${isPerDb(id) ? 'Weight ea' : 'Weight'}</label>
            <input type="text" inputmode="decimal" placeholder="${esc(wtPlaceholder)}"
                   value="${esc(defaultWtVal)}" data-ex-weight="${id}" />
            <span class="edit-ex-unit">${weightUnit}</span>
          </div>` : '';
        return `<div class="ex-pick-row${selected}" data-ex="${id}"${isCustom ? ' data-custom="1"' : ''} role="button" tabindex="0">
          <div style="display:flex;align-items:center;gap:12px;width:100%;">
            <span class="ex-pick-check">${isPicked ? '✓' : ''}</span>
            <div class="ex-pick-info">
              <div class="ex-pick-name">${esc(ex.name)}</div>
              <div class="ex-pick-meta">${ex.sets} × ${esc(ex.reps)}</div>
            </div>
          </div>
          ${weightInputHTML}
        </div>`;
      }).join('');

      const formId = `custom-${key}-${cat}`;
      const addCustomHTML = `
        <div class="ex-pick-add">
          <button class="ex-pick-add-btn" data-custom-toggle data-group="${key}" data-cat="${esc(cat)}">+ Add custom exercise</button>
          <div class="ex-pick-add-form" data-custom-form data-group="${key}" data-cat="${esc(cat)}" id="${formId}" style="display:none;">
            <input type="text" data-custom-name placeholder="Exercise name" maxlength="40" />
            <div class="ex-pick-add-row">
              <input type="text" inputmode="numeric" data-custom-sets placeholder="Sets" value="3" maxlength="2" />
              <input type="text" data-custom-reps placeholder="Reps · 8-12" value="8-12" maxlength="10" />
            </div>
            <div class="ex-pick-add-actions">
              <button class="ex-pick-add-cancel" data-custom-cancel data-group="${key}" data-cat="${esc(cat)}">Cancel</button>
              <button class="ex-pick-add-save" data-custom-save data-group="${key}" data-cat="${esc(cat)}">Add</button>
            </div>
          </div>
        </div>`;

      return `
        <div class="ex-group-label">
          <span>${esc(label)}</span>
          <span class="ex-group-count">${pickedCount} picked</span>
        </div>

    function attachExercisePickerHandlers() {
      const day = wizState.draft[wizState.exDayIdx];

      document.querySelectorAll('.ex-pick-row').forEach(row => {
        row.addEventListener('click', e => {
          // Don't toggle when interacting with weight input / its label
          if (e.target.closest('.edit-ex-weight')) return;
          const id = row.dataset.ex;
          const list = day.exercises || [];
          const idx = list.findIndex(x => x.id === id);
          if (idx >= 0) list.splice(idx, 1);
          else list.push({ id });
          day.exercises = list;
          renderWizard();
        });
      });

      document.querySelectorAll('[data-ex-weight]').forEach(inp => {
        inp.addEventListener('input', () => {
          const id = inp.dataset.exWeight;
          const ex = (day.exercises || []).find(x => x.id === id);
          if (ex) ex.defaultWeight = inp.value.trim();
        });
        inp.addEventListener('click', e => e.stopPropagation());
      });

      // Custom-exercise add UI: toggle / cancel / save
      function findCustomForm(group, cat) {
        return document.querySelector(`[data-custom-form][data-group="${group}"][data-cat="${cat}"]`);
      }
      function findCustomToggle(group, cat) {
        return document.querySelector(`[data-custom-toggle][data-group="${group}"][data-cat="${cat}"]`);
      }
      document.querySelectorAll('[data-custom-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const form = findCustomForm(btn.dataset.group, btn.dataset.cat);
          if (!form) return;
          form.style.display = 'flex';
          btn.style.display = 'none';
          const nameInput = form.querySelector('[data-custom-name]');
          if (nameInput) nameInput.focus();
        });
      });
      document.querySelectorAll('[data-custom-cancel]').forEach(btn => {
        btn.addEventListener('click', () => {
          const form = findCustomForm(btn.dataset.group, btn.dataset.cat);
          const toggle = findCustomToggle(btn.dataset.group, btn.dataset.cat);
          if (form) form.style.display = 'none';
          if (toggle) toggle.style.display = '';
        });
      });
      document.querySelectorAll('[data-custom-save]').forEach(btn => {
        btn.addEventListener('click', () => {
          const groupKey = btn.dataset.group;
          const cat = btn.dataset.cat;
          const form = findCustomForm(groupKey, cat);
          if (!form) return;
          const name    = (form.querySelector('[data-custom-name]')?.value || '').trim();
          const setsStr = (form.querySelector('[data-custom-sets]')?.value || '').trim();
          const reps    = (form.querySelector('[data-custom-reps]')?.value || '').trim();
          if (!name) {
            form.querySelector('[data-custom-name]')?.focus();
            return;
          }
          const sets = Math.max(1, Math.min(10, parseInt(setsStr, 10) || 3));
          const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'ex';
          const id = `custom_${slug}_${Date.now().toString(36)}`;
          const customs = loadCustomEx();
          customs.push({ id, name, sets, reps: reps || '8-12', category: cat, group: groupKey });
          saveCustomEx(customs);
          EX[id] = { name, sets, reps: reps || '8-12' };
          // Auto-pick the new exercise into this day
          day.exercises = day.exercises || [];
          if (!day.exercises.some(e => e.id === id)) day.exercises.push({ id });
          renderWizard();
        });
      });

      document.getElementById('wiz-autofill').addEventListener('click', () => {
        const cat = day.category || 'full';
        day.exercises = (RECOMMENDED[cat] || []).map(id => ({ id }));
        renderWizard();
      });

      document.getElementById('wiz-prev').addEventListener('click', () => {
        if (wizState.singleDayMode) { closeWizard(); return; }
        // Go to prev non-rest day, or back to split editor
        const nonRestIdxs = wizState.draft.map((d, i) => d.category !== 'rest' ? i : -1).filter(i => i >= 0);
        const pos = nonRestIdxs.indexOf(wizState.exDayIdx);
        if (pos <= 0) {
          wizState.mode = 'split';
        } else {
          wizState.exDayIdx = nonRestIdxs[pos - 1];

        renderWizard();
      });

      document.getElementById('wiz-next').addEventListener('click', () => {
        if (wizState.singleDayMode) {
          // Save just this one day's exercises into stored split

          if (stored[wizState.exDayIdx]) {
            stored[wizState.exDayIdx] = { ...stored[wizState.exDayIdx], exercises: day.exercises };
            saveSplit(stored);
          }
          closeWizard();
          renderSplit();
          return;
        }
        // Wizard flow: advance to next non-rest day or finalize
        const nonRestIdxs = wizState.draft.map((d, i) => d.category !== 'rest' ? i : -1).filter(i => i >= 0);
        const pos = nonRestIdxs.indexOf(wizState.exDayIdx);
        if (pos < nonRestIdxs.length - 1) {

    function dateOffsetKey(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function seedDemo() {
      saveSplit(DEMO_SPLIT);
      tryWrite(SPLIT_LOCKED_KEY, '1');

      const histLogByEx = {};
      const historyByEx = {};

      for (let dayNum = 1; dayNum <= 6; dayNum++) {
        const day = DEMO_SPLIT[dayNum - 1];
        const exProg = PROGRESSION[dayNum] || {};

        for (let occ = 0; occ < 6; occ++) {
          // occ=5 most recent (dayNum days ago); older occurrences step back 8 days each
          const daysAgo = dayNum + (5 - occ) * 8;
          const dateKey = dateOffsetKey(daysAgo);
          const session = {};

          for (const ex of day.exercises) {
            const weights = exProg[ex.id];
            if (!weights) continue;
            const wt = weights[occ];
            const targetReps = parseInt(ex.reps, 10) || 8;
            const justJumped = (occ > 0 && weights[occ] > weights[occ - 1]);
            const sets = [];
            for (let s = 0; s < ex.sets; s++) {
              let reps = targetReps;
              // Realistic: occasional 1-rep miss on last set when stepping up
              if (justJumped && s === ex.sets - 1 && (occ * 7 + s) % 5 === 0) {
                reps = Math.max(1, targetReps - 1);
              }
              sets.push({ wt, reps, done: true, missed: false });
            }
            session[ex.id] = { sets };

            const done = sets.filter(s => s.done);
            const topWeight = Math.max(...done.map(s => s.wt));
            const topReps   = Math.max(...done.map(s => s.reps));
            const volume    = done.reduce((sum, s) => sum + s.wt * s.reps, 0);

            if (!histLogByEx[ex.id]) histLogByEx[ex.id] = [];
            histLogByEx[ex.id].push({ date: dateKey, topWeight, topReps, volume: Math.round(volume) });

            if (!historyByEx[ex.id] || historyByEx[ex.id].date < dateKey) {
              historyByEx[ex.id] = { date: dateKey, sets, topWeight, topReps };
            }
          }

          tryWrite(SESSION_PREFIX + dateKey + '.' + dayNum, JSON.stringify(session));
          tryWrite(COMPLETED_PREFIX + dateKey + '.' + dayNum, JSON.stringify({ date: dateKey, snapshot: session }));
        }
      }

      for (const exId of Object.keys(historyByEx)) {
        tryWrite(HISTORY_PREFIX + exId, JSON.stringify(historyByEx[exId]));
      }
      for (const exId of Object.keys(histLogByEx)) {
        const log = histLogByEx[exId].sort((a, b) => a.date.localeCompare(b.date));
        tryWrite(HISTLOG_PREFIX + exId, JSON.stringify(log));
      }

      // Seed a believable streak for the demo screen-grabs — 12 days and
      // counting, last lock-in was today so it shows confirmed (not at-risk).
      tryWrite(STREAK_KEY, JSON.stringify({ count: 12, lastDate: todayKey(), lastDayNum: 1 }));

      tryWrite(SEED_KEY, SEED_VERSION);
    }

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    }

      downloadJSON({ namespace: NS, exportedAt: new Date().toISOString(), data }, `splitlog-${stamp}.json`);

      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let parsed;
        try { parsed = JSON.parse(reader.result); }
        catch { showDataMsg('That file isn\'t valid JSON.', true); return; }
        const payload = parsed && parsed.data;
        if (!payload || typeof payload !== 'object') {
          showDataMsg('No data found in that file.', true); return;
        }
        const keys = Object.keys(payload).filter(k => k.startsWith(NS));
        if (!keys.length) {
          showDataMsg('No matching data in that file (wrong namespace).', true); return;
        }
        if (!confirm(`Import ${keys.length} entries? This replaces any matching keys.`)) return;
        let written = 0;
        for (const k of keys) {
          if (tryWrite(k, payload[k])) written++;
        }
        showDataMsg(`Imported ${written} entries.`);
        setTimeout(() => location.reload(), 1200);

      reader.readAsText(file);
      e.target.value = ''; // allow re-importing the same file

    // ── Between-set rest timer ─────────────────────────────────────────────
    let _restTimerInterval = null;
    let _restTimerEndsAt = 0;
    let _restTimerTotal = 0;

    function startRestTimer(seconds, exerciseName) {
      stopRestTimer();
      if (!seconds || seconds < 1) return;
      _restTimerTotal = seconds;
      _restTimerEndsAt = Date.now() + seconds * 1000;
      const el = document.getElementById('rest-timer');
      const labelEl = document.getElementById('rest-timer-label');
      if (!el) return;
      if (labelEl) labelEl.textContent = exerciseName ? `Rest · ${exerciseName}` : 'Rest';
      el.hidden = false;
      el.classList.remove('done');
      updateRestTimer();
      _restTimerInterval = setInterval(updateRestTimer, 250);
      if (navigator.vibrate) navigator.vibrate(10);
    }

    function updateRestTimer() {
      const el = document.getElementById('rest-timer');
      const timeEl = document.getElementById('rest-timer-time');
      const fillEl = document.getElementById('rest-timer-fill');
      if (!el || !timeEl || !fillEl) return;
      const remainingMs = Math.max(0, _restTimerEndsAt - Date.now());
      const secs = Math.ceil(remainingMs / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      timeEl.textContent = m + ':' + String(s).padStart(2, '0');
      const pct = _restTimerTotal > 0 ? (remainingMs / (_restTimerTotal * 1000)) * 100 : 0;
      fillEl.style.width = Math.max(0, pct) + '%';
      if (remainingMs <= 0) {
        clearInterval(_restTimerInterval);
        _restTimerInterval = null;
        el.classList.add('done');
        timeEl.textContent = 'Go';
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        setTimeout(() => {
          // Auto-dismiss only if user didn't already skip
          if (el && el.classList.contains('done')) {
            el.hidden = true;
            el.classList.remove('done');
          }
        }, 3000);
      }
    }

    function stopRestTimer() {
      if (_restTimerInterval) { clearInterval(_restTimerInterval); _restTimerInterval = null; }
      const el = document.getElementById('rest-timer');
      if (el) { el.hidden = true; el.classList.remove('done'); }
    }

    document.getElementById('rest-timer-skip').addEventListener('click', stopRestTimer);
    function adjustRestTimer(deltaSec) {
      _restTimerEndsAt += deltaSec * 1000;
      _restTimerTotal = Math.max(15, _restTimerTotal + deltaSec);
      const el = document.getElementById('rest-timer');
      if (deltaSec < 0 && _restTimerEndsAt <= Date.now()) {
        // Subtracted past zero — end immediately
        _restTimerEndsAt = Date.now();
      }
      if (el && el.classList.contains('done') && _restTimerEndsAt > Date.now()) {
        el.classList.remove('done');
        if (!_restTimerInterval) _restTimerInterval = setInterval(updateRestTimer, 250);
      }
      updateRestTimer();
    }
    document.getElementById('rest-timer-add').addEventListener('click', () => adjustRestTimer(15));
    document.getElementById('rest-timer-sub').addEventListener('click', () => adjustRestTimer(-15));

    // template.html (DEMO_MODE=false) opens with no split at all — the empty
    // hero in renderSplit() drives the user into the customize wizard from
    // scratch. The demo path has already saved DEMO_SPLIT via seedDemo above.
    renderSplit();

    // ── Supabase sync ──────────────────────────────────────────────────────
    // Offline-first cross-device sync. Local writes always go to
    // localStorage immediately; cloud is best-effort. Network failure
    // silently falls back to local. Last-write-wins for v1.
    //
    // Auth resolution (priority):
    //   1. window.opener?.ohwisey (parent dashboard exposed config + session)
    //   2. NS-stored Supabase URL+anon-key (own config from past sign-in)
    //   3. Local-only mode (no sync, settings shows sign-in UI)
    //
    // Demo mode (DEMO_MODE=true) skips sync entirely.
    const SUPABASE_URL_KEY  = NS + 'supabaseUrl';
    const SUPABASE_ANON_KEY = NS + 'supabaseAnonKey';
    const SUPABASE_AUTH_KEY = NS + 'auth';
    const SUPABASE_TABLE    = 'app_data';
    const SUPABASE_APP_SLUG = 'splitlog';
    const SUPABASE_STATE_KEY = 'state';
    // Keys that survive an applyDataPayload wipe and never upload — Supabase
    // config + auth tokens (per-device, sensitive — never sync to cloud).
    const SYNC_PROTECTED_KEYS = new Set([SUPABASE_URL_KEY, SUPABASE_ANON_KEY, SUPABASE_AUTH_KEY]);

    // _SL_INJECTED_CLIENT / _SL_INJECTED_USER_ID / _SL_MODE / _SL_VIEW /
    // _widgetExpanded / syncState / inheritedFromParent are all hoisted up
    // near tryWrite — they need to exist before renderSplit() boots and
    // before the probeStorage() IIFE makes its first localStorage write.

    // supabase / session / _pushTimer / _skipPush / syncState /
    // inheritedFromParent / _SL_* / _widgetExpanded are all hoisted up near
    // tryWrite. _sdkLoadPromise stays local to this block — it's only
    // touched by loadSupabaseSdk() which runs well after boot.
    let _sdkLoadPromise = null;

    function loadSupabaseSdk() {
      if (_sdkLoadPromise) return _sdkLoadPromise;
      _sdkLoadPromise = import('https://esm.sh/@supabase/supabase-js@2')
        .then(mod => mod.createClient)
        .catch(e => {
          console.warn('Supabase SDK load failed:', e && e.message);
          _sdkLoadPromise = null;
          return null;
        });
      return _sdkLoadPromise;
    }

    function getInheritedConfig() {
      try {
        const parent = window.opener && window.opener.ohwisey;
        if (parent && parent.supabaseUrl && parent.supabaseAnonKey) {
          return {
            url: parent.supabaseUrl,
            key: parent.supabaseAnonKey,
            session: parent.session || null,
          };
        }
      } catch { /* cross-origin denial — silent */ }
      return null;
    }

    function getStoredConfig() {
      const url = localStorage.getItem(SUPABASE_URL_KEY);
      const key = localStorage.getItem(SUPABASE_ANON_KEY);
      if (url && key) return { url, key };
      return null;
    }

    function setSyncState(s) {
      syncState = s;
      updateSyncDot();
      if (document.getElementById('settings-modal').classList.contains('open')) {
        renderSyncSection();
      }
    }

    function updateSyncDot() {
      // Widget mode renders a second .sync-dot inside the widget gear. Iterate
      // every dot so both stay in sync.
      const dots = document.querySelectorAll('.sync-dot');
      if (!dots.length) return;
      dots.forEach(dot => {
        if (DEMO_MODE) { dot.className = 'sync-dot hidden'; return; }
        dot.className = 'sync-dot ' + syncState;
      });
    }

    function schedulePush() {
      if (DEMO_MODE) return;
      if (_skipPush) return;
      if (!supabase || !session) return;
      if (_pushTimer) clearTimeout(_pushTimer);
      _pushTimer = setTimeout(() => {
        _pushTimer = null;
        cloudPush();
      }, 1000);
    }

    async function cloudPush() {
      if (!supabase || !session) return;
      setSyncState('syncing');
      try {
        // Strip auth/config keys — never upload tokens or per-device config.
        const all = collectAllData();
        const data = {};
        for (const k of Object.keys(all)) {
          if (!SYNC_PROTECTED_KEYS.has(k)) data[k] = all[k];
        }
        const { error } = await supabase
          .from(SUPABASE_TABLE)
          .upsert({
            user_id: session.user.id,
            app_slug: SUPABASE_APP_SLUG,
            key: SUPABASE_STATE_KEY,
            value: data,
            updated_at: new Date().toISOString(),
          }, { onConflict: 'user_id,app_slug,key' });
        if (error) throw error;
        setSyncState('synced');
      } catch (e) {
        console.warn('cloudPush failed:', e && e.message);
        setSyncState('error');
      }
    }

    async function cloudPull() {
      if (!supabase || !session) return null;
      try {
        const { data, error } = await supabase
          .from(SUPABASE_TABLE)
          .select('value')
          .eq('user_id', session.user.id)
          .eq('app_slug', SUPABASE_APP_SLUG)
          .eq('key', SUPABASE_STATE_KEY)
          .maybeSingle();
        if (error) throw error;
        return (data && data.value) || null;
      } catch (e) {
        console.warn('cloudPull failed:', e && e.message);
        return null;
      }
    }

    function applyDataPayload(payload) {
      if (!payload || typeof payload !== 'object') return;
      _skipPush = true;
      try {
        // Wipe existing NS keys (except protected: config + auth session)
        const toRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(NS) && !SYNC_PROTECTED_KEYS.has(k)) {
            toRemove.push(k);
          }
        }
        toRemove.forEach(k => { try { localStorage.removeItem(k); } catch {} });
        // Apply incoming (also skip protected keys — never restore stale auth/config)
        for (const k of Object.keys(payload)) {
          if (typeof k === 'string' && k.startsWith(NS) && !SYNC_PROTECTED_KEYS.has(k)) {
            try { localStorage.setItem(k, payload[k]); } catch {}
          }
        }
      } finally {
        _skipPush = false;
      }
    }

    async function initSync() {
      if (DEMO_MODE) {
        updateSyncDot();
        return;
      }

      // 0. Embedder supplied a ready-to-use client via SplitLog.mount options.
      // Skip the SDK load, skip config discovery, skip auth UI. Trust the host.
      if (_SL_INJECTED_CLIENT) {
        supabase = _SL_INJECTED_CLIENT;
        inheritedFromParent = true;
        if (_SL_INJECTED_USER_ID) {
          session = { user: { id: _SL_INJECTED_USER_ID, email: '(inherited)' } };
        } else {
          try {
            const { data } = await supabase.auth.getSession();
            session = (data && data.session) || null;
          } catch {}
        }
        if (session) {
          await firstSignInSync();
        } else {
          setSyncState('configured');
        }
        return;
      }

      // 1. Try parent dashboard via window.opener
      let config = getInheritedConfig();
      if (config) inheritedFromParent = true;

      // 2. Try stored config
      if (!config) config = getStoredConfig();

      // No config → local-only
      if (!config) {
        setSyncState('local');
        return;
      }

      // Show dot immediately while SDK loads
      setSyncState('configured');

      const createClient = await loadSupabaseSdk();
      if (!createClient) { setSyncState('error'); return; }

      try {
        supabase = createClient(config.url, config.key, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storageKey: SUPABASE_AUTH_KEY,
          },
        });
      } catch (e) {
        console.warn('Supabase init failed:', e && e.message);
        setSyncState('error');
        return;
      }

      // Inherit session from parent if available
      if (config.session && config.session.access_token && config.session.refresh_token) {
        try {
          await supabase.auth.setSession({
            access_token: config.session.access_token,
            refresh_token: config.session.refresh_token,
          });
        } catch (e) {
          console.warn('Inherited session apply failed:', e && e.message);
        }
      }

      // Read current session (handles persisted or magic-link redirect)
      try {
        const { data } = await supabase.auth.getSession();
        session = (data && data.session) || null;
      } catch {}

      // Subscribe to future auth changes (sign-in, sign-out, token refresh)
      supabase.auth.onAuthStateChange((event, newSession) => {
        const hadSession = !!session;
        session = newSession || null;
        if (!hadSession && session) {
          // First sign-in this load — try pull, fall back to push
          firstSignInSync();
        } else if (hadSession && !session) {
          // Signed out
          setSyncState('configured');
        }
        if (document.getElementById('settings-modal').classList.contains('open')) {
          renderSyncSection();
        }
      });

      if (!session) {
        setSyncState('configured');
        return;
      }

      // Signed in — pull, adopt if non-empty, else push local
      await firstSignInSync();

      // Expose to other ohwisey standalones that might be opened from here.
      // Skip in embed mode — the host already owns window.ohwisey.
      if (_SL_MODE === 'standalone') {
        try {
          window.ohwisey = {
            supabaseUrl: config.url,
            supabaseAnonKey: config.key,
            get session() { return session; },
          };
        } catch {}
      }
    }

    async function firstSignInSync() {
      if (!supabase || !session) return;
      setSyncState('syncing');
      const cloudData = await cloudPull();
      if (cloudData && Object.keys(cloudData).length > 0) {
        applyDataPayload(cloudData);
        renderSplit();
        setSyncState('synced');
      } else {
        // Cloud empty — push local up
        await cloudPush();
      }
    }

    // ── Sync settings section (inside settings sheet) ───────────────────────
    function syncStatusLabel() {
      if (DEMO_MODE) return 'Demo (sync disabled)';
      switch (syncState) {
        case 'local':      return 'Local only';
        case 'configured': return 'Not signed in';
        case 'syncing':    return 'Syncing…';
        case 'synced':     return 'Synced';
        case 'error':      return 'Sync error';
      }
      return 'Unknown';
    }

    function renderSyncSection() {
      const host = document.getElementById('sync-section');
      if (!host) return;
      if (DEMO_MODE) { host.hidden = true; return; }
      host.hidden = false;

      const dotCls = 'sync-head-dot ' + (syncState === 'local' ? '' : syncState);
      const title = `
        <div class="sync-head">
          <span class="${dotCls}"></span>
          <span class="sync-head-title">Sync</span>
        </div>`;

      let detail = '';
      let actions = '';

      if (inheritedFromParent && session) {
        detail = `Signed in as <strong>${esc(session.user && session.user.email || 'user')}</strong> via your dashboard. Workouts sync across devices automatically.`;
      } else if (inheritedFromParent && !session) {
        detail = `Dashboard configured Supabase but you're not signed in there. Sign in from the dashboard and reopen.`;
      } else if (syncState === 'local') {
        detail = `Sync isn't set up. Paste your Supabase project URL and anon key to enable cross-device sync. Find these in Supabase › Project Settings › API.`;
        actions = `
          <div class="sync-actions">
            <input class="sync-input" id="sync-url-input" type="text" autocomplete="off" placeholder="https://your-project.supabase.co" />
            <input class="sync-input" id="sync-key-input" type="text" autocomplete="off" placeholder="anon public key" />
            <div class="sync-btn-row">
              <button class="sync-btn" id="sync-save-config">Save &amp; continue</button>
            </div>
          </div>`;
      } else if (syncState === 'configured' && !session) {
        detail = `Supabase is configured. Sign in with a magic link to sync this device.`;
        actions = `
          <div class="sync-actions">
            <input class="sync-input" id="sync-email-input" type="email" autocomplete="email" placeholder="you@example.com" />
            <div class="sync-btn-row">
              <button class="sync-btn" id="sync-send-link">Send magic link</button>
              <button class="sync-btn secondary" id="sync-forget-config">Forget config</button>
            </div>
          </div>`;
      } else if (session) {
        detail = `Signed in as <strong>${esc(session.user && session.user.email || 'user')}</strong>. Workouts sync to <strong>app_data → splitlog</strong>.`;
        actions = `
          <div class="sync-actions">
            <div class="sync-btn-row">
              <button class="sync-btn secondary" id="sync-pull-now">Pull from cloud</button>
              <button class="sync-btn secondary" id="sync-sign-out">Sign out</button>
            </div>
          </div>`;
      } else if (syncState === 'error') {
        detail = `Sync hit an error. Check the network, your URL/key, or try forgetting and re-pasting.`;
        actions = `
          <div class="sync-actions">
            <div class="sync-btn-row">
              <button class="sync-btn secondary" id="sync-forget-config">Forget config</button>
            </div>
          </div>`;
      }

      host.innerHTML = `${title}<div class="sync-detail">${detail}</div>${actions}<div class="sync-msg" id="sync-msg"></div>`;

      // Wire actions
      const saveBtn = document.getElementById('sync-save-config');
      if (saveBtn) saveBtn.addEventListener('click', async () => {
        const url = (document.getElementById('sync-url-input').value || '').trim();
        const key = (document.getElementById('sync-key-input').value || '').trim();
        if (!/^https?:\/\/.+/i.test(url) || key.length < 20) {
          showSyncMsg('Need a valid URL and an anon key.', true);
          return;
        }
        localStorage.setItem(SUPABASE_URL_KEY, url);
        localStorage.setItem(SUPABASE_ANON_KEY, key);
        showSyncMsg('Saved. Loading…');
        await initSync();
        renderSyncSection();
      });
      const sendBtn = document.getElementById('sync-send-link');
      if (sendBtn) sendBtn.addEventListener('click', async () => {
        const email = (document.getElementById('sync-email-input').value || '').trim();
        if (!/.+@.+\..+/.test(email)) { showSyncMsg('Enter a valid email.', true); return; }
        sendBtn.disabled = true;
        showSyncMsg('Sending magic link…');
        try {
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.href.split('#')[0] },
          });
          if (error) throw error;
          showSyncMsg('Check your email for the sign-in link.');
        } catch (e) {
          showSyncMsg(e && e.message || 'Send failed.', true);
        } finally {
          sendBtn.disabled = false;
        }
      });
      const forgetBtn = document.getElementById('sync-forget-config');
      if (forgetBtn) forgetBtn.addEventListener('click', () => {
        if (!confirm('Forget Supabase config? You can paste it again later. Your local workouts stay.')) return;
        localStorage.removeItem(SUPABASE_URL_KEY);
        localStorage.removeItem(SUPABASE_ANON_KEY);
        supabase = null; session = null; inheritedFromParent = false;
        setSyncState('local');
        renderSyncSection();
      });
      const pullBtn = document.getElementById('sync-pull-now');
      if (pullBtn) pullBtn.addEventListener('click', async () => {
        pullBtn.disabled = true;
        showSyncMsg('Pulling latest from cloud…');
        setSyncState('syncing');
        const cloudData = await cloudPull();
        if (cloudData && Object.keys(cloudData).length > 0) {
          applyDataPayload(cloudData);
          renderSplit();
          setSyncState('synced');
          showSyncMsg('Up to date.');
        } else {
          setSyncState('synced');
          showSyncMsg('Cloud is empty.');
        }
        pullBtn.disabled = false;
      });
      const signOutBtn = document.getElementById('sync-sign-out');
      if (signOutBtn) signOutBtn.addEventListener('click', async () => {
        signOutBtn.disabled = true;
        try {
          await supabase.auth.signOut();
        } catch {}
        signOutBtn.disabled = false;
      });
    }

    function showSyncMsg(text, isError) {
      const el = document.getElementById('sync-msg');
      if (!el) return;
      el.textContent = text;
      el.className = 'sync-msg' + (isError ? ' error' : '');
      setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 5000);
    }

    if (!DEMO_MODE) initSync();
  </script>
</body>
</html>
