    </div>
  </div>

  <!-- Tip / swap popover -->
  <div class="popover-mask" id="popover">
    <div class="popover-sheet" id="popover-sheet"></div>
  </div>

  <!-- Between-set rest timer (floats above content) -->
  <div class="rest-timer" id="rest-timer" hidden>
    <div class="rest-timer-label" id="rest-timer-label">Rest</div>
    <div class="rest-timer-time" id="rest-timer-time">0:00</div>
    <div class="rest-timer-bar"><div class="rest-timer-fill" id="rest-timer-fill"></div></div>
    <div class="rest-timer-actions">
      <button class="rest-timer-step" id="rest-timer-sub">− 15s</button>
      <button class="rest-timer-step" id="rest-timer-add">+ 15s</button>
      <button class="rest-timer-skip" id="rest-timer-skip">Skip</button>
    </div>
  </div>

  <script>
    'use strict';

    // ── Storage keys ───────────────────────────────────────────────────────
    // DEMO_MODE controls BOTH whether the demo seeds on first load AND which
    // localStorage namespace we use. On Vercel both files share the same
    // origin, so a single namespace would make template.html inherit the
    // demo's seeded data — namespacing keeps them cleanly independent.
    const DEMO_MODE        = false; // template.html — no demo seed
    // Separate namespace per build mode prevents same-origin collisions
    // when multiple instances are hosted on the same domain.
    const NS               = DEMO_MODE ? 'splitlog.demo.' : 'splitlog.';
    const SPLIT_KEY        = NS + 'config';
    const SPLIT_LOCKED_KEY = NS + 'locked';
    const PICKED_DAY_KEY   = NS + 'pickedDay';
    const PICKED_DATE_KEY  = NS + 'pickedDate';
    const SESSION_PREFIX   = NS + 'session.';   // .{date}.{dayNum} -> { [exId]: { sets: [{wt,reps,done,missed}] } }
    const HISTORY_PREFIX   = NS + 'history.';   // .{exId} -> { date, sets, topWeight, topReps }
    const HISTLOG_PREFIX   = NS + 'histlog.';   // .{exId} -> [{date, topWeight, topReps, volume}, ...]
    const STREAK_KEY       = NS + 'streak';      // JSON { count, lastDate (YYYY-MM-DD), lastDayNum } — see lockDayIn()
    const COMPLETED_PREFIX = NS + 'completed.'; // .{date}.{dayNum} -> { date, snapshot }
    const CARDIO_PREFIX    = NS + 'cardio.';    // .{date}.{dayNum} -> { done, type, customName, totalMinutes, zones }
    const CUSTOM_EX_KEY    = NS + 'customEx';   // array of {id,name,sets,reps,category,group}
    const SEED_KEY         = NS + 'seeded';
    const SEED_VERSION     = 'demo-v2';
    const SETUP_KEY        = NS + 'setupComplete';
    const DATA_VERSION_KEY = NS + 'dataVersion';
    const CURRENT_DATA_VERSION = 1; // bump on schema changes; never wipes data, just for future migrations
    const APP_VERSION      = 'v1.0';

    // ── Storage safety net ─────────────────────────────────────────────────
    // Single helper so every write is try/catch'd and a quota / private-mode
    // failure surfaces visibly instead of silently dropping the user's data.
    let _storageWarned = false;

    // ── Hoisted sync + view state ─────────────────────────────────────────
    // tryWrite() calls schedulePush() (both hoisted by function declaration).
    // schedulePush reads _skipPush/_pushTimer/supabase/session, and tryWrite
    // fires from the probeStorage() IIFE further down — which runs at parse
    // time, before the sync block initializes its own `let` declarations.
    //
    // renderSplit() — also called at boot — reads _SL_VIEW, _widgetExpanded,
    // and (indirectly via renderWidget) syncState. Same TDZ hazard, same
    // remedy: declare them up here so every early caller sees an
    // initialized value.
    let _skipPush          = false;
    let _pushTimer         = null;
    let supabase           = null;
    let session            = null;
    let syncState          = 'local';   // local | configured | syncing | synced | error
    let inheritedFromParent = false;
    let _widgetExpanded    = false;     // toggled by widget tap / back-bar in view: 'today'
    // SplitLog.mount() declares __SPLITLOG_*__ inside its closure before
    // running the app code; in the direct-standalone HTML they're undefined.
    // typeof guards keep both paths working.
    const _SL_INJECTED_CLIENT  = (typeof __SPLITLOG_SUPABASE_CLIENT__ !== 'undefined') ? __SPLITLOG_SUPABASE_CLIENT__ : null;
    const _SL_INJECTED_USER_ID = (typeof __SPLITLOG_USER_ID__ !== 'undefined') ? __SPLITLOG_USER_ID__ : null;
    const _SL_MODE             = (typeof __SPLITLOG_MODE__ !== 'undefined') ? __SPLITLOG_MODE__ : 'standalone';
    const _SL_VIEW             = ((typeof __SPLITLOG_VIEW__ !== 'undefined') && __SPLITLOG_VIEW__ === 'today') ? 'today' : 'full';

    function tryWrite(key, value) {
      try {
        localStorage.setItem(key, value);
        if (key.startsWith(NS) && typeof schedulePush === 'function') schedulePush();
        return true;
      }
      catch (e) {
        console.warn('tryWrite failed for', key, '·', e && e.message);
        if (!_storageWarned) {
          _storageWarned = true;
          showStorageBanner();
        }
        return false;
      }
    }
    function tryRemove(key) {
      try {
        localStorage.removeItem(key);
        if (key.startsWith(NS) && typeof schedulePush === 'function') schedulePush();
        return true;
      } catch { return false; }
    }
    function showStorageBanner() {

      el.innerHTML = `<strong>Storage is blocked</strong><br>Your browser isn't letting this page save data (private mode? quota full?). Sets you log won't persist after refresh.`;
      // Anchor inside the app's own root (`.wrap` exists in both standalone
      // and embed contexts) so scoped CSS matches in the bundle build.
      const host = document.querySelector('.wrap') || document.body;
      host.appendChild(el);
    }

    function tailorWeight(exId, profile) {
      if (!profile || !profile.weight) return null;
      const t = TAILOR_TABLE[exId];
      if (!t) return null;
      const gMap = t[profile.gender === 'f' ? 'f' : 'm'];
      const v = gMap[profile.level] || gMap.int;
      let w = 0;
      if (t.type === 'bw' || t.type === 'bwHalf') w = profile.weight * v;
      else                                        w = v; // 'add' or 'fixed'
      if (profile.age && profile.age > 35) {
        w *= Math.max(0.65, 1 - (profile.age - 35) * 0.005);
      }
      if (w <= 0) return 0;
      if (w < 5)  return Math.max(0, Math.round(w * 2) / 2);
      return Math.max(0, Math.round(w * 2 / 5) * 2.5);
    }
    function tailorEstimate(exId) {
      return tailorWeight(exId, getProfile());
    }

    // ── Auto-detect category from day name ─────────────────────────────────
    // Tries to be lenient — covers most common ways people name training days
    // ("Lower", "Leg day", "Glutes + hams", "Delts", "Lats / Traps", etc.).
    // First match wins, so more specific patterns sit earlier in the chain.
    function detectCategory(name, type) {
      const n = (name || '').toLowerCase();
      if ((type || '').toUpperCase() === 'RECOVERY') return 'rest';
      if (/rest|recovery|off\s*day|deload/.test(n)) return 'rest';
      if (/upper/.test(n)) return 'upper';
      if (/lower/.test(n)) return 'lower';
      if (/full[\s-]?body|full body/.test(n)) return 'full';
      if (/push/.test(n)) return 'push';
      if (/pull/.test(n)) return 'pull';
      if (/legs?\b|quad|ham|glut|calf|calves|posterior chain/.test(n)) return 'legs';
      if (/chest|pec/.test(n)) return 'chest';
      if (/back\b|lat\b|lats\b|traps?\b/.test(n)) return 'back';
      if (/shoulder|delts?\b|ohp|press day/.test(n)) return 'shoulders';
      if (/arms?\b|bicep|tricep|gun day/.test(n)) return 'arms';
      if (/abs?\b|core|midline|six[\s-]?pack/.test(n)) return 'abs';
      return 'full'; // safe default — Full Body has a good catch-all exercise list
    }

    // ── Date helpers ───────────────────────────────────────────────────────
    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function shiftDate(ymd, deltaDays) {
      const [y, m, d] = ymd.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + deltaDays);
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }

    // ── Streak ─────────────────────────────────────────────────────────────
    // Counter-based streak: a single JSON record holds { count, lastDate,
    // lastDayNum }. Tapping any day card is the "lock-in" event that bumps
    // the counter. Rules:
    //   • first lock-in ever            → count = 1
    //   • same-day re-lock              → no change (re-tapping doesn't game it)
    //   • gap of 1 or 2 days since last → count + 1  (forgiving — one missed
    //                                                  day doesn't reset the run)
    //   • gap of 3+ days                → reset to 1
    // computeStreak() also expires the count past a 2-day gap so a stale
    // counter doesn't pretend the streak is still alive.
    function readStreak() {
      try { return JSON.parse(localStorage.getItem(STREAK_KEY)); } catch { return null; }
    }
    function parseYMDLocal(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function daysBetween(a, b) {
      return Math.round((parseYMDLocal(a) - parseYMDLocal(b)) / 86400000);
    }
    function lockDayIn(dayNum) {
      const today = todayKey();
      let streak = readStreak();
      if (!streak) {
        streak = { count: 1, lastDate: today, lastDayNum: dayNum };
      } else if (streak.lastDate === today) {
        // Same-day re-pick: keep count, update last picked day for recommendations.
        streak.lastDayNum = dayNum;
      } else {
        const gap = daysBetween(today, streak.lastDate);
        streak.count = gap > 0 && gap <= 2 ? (streak.count + 1) : 1;
        streak.lastDate = today;
        streak.lastDayNum = dayNum;
      }
      tryWrite(STREAK_KEY, JSON.stringify(streak));
      return streak.count;
    }
    function computeStreak() {
      const streak = readStreak();
      if (!streak || !streak.lastDate) return { count: 0, todayLogged: false };
      const today = todayKey();
      const gap = daysBetween(today, streak.lastDate);
      // Stale: lastDate is more than 2 days ago → streak has expired.
      if (gap > 2) return { count: 0, todayLogged: false };
      return { count: streak.count, todayLogged: gap === 0 };
    }
    function getRecommendedDay(splitLen) {
      const streak = readStreak();
      if (!streak || !streak.lastDayNum || !splitLen) return null;
      // If today is already locked, no recommendation — they've chosen.
      if (streak.lastDate === todayKey()) return null;
      return (streak.lastDayNum % splitLen) + 1;
    }

    // ── Widget helpers (used by view: 'today') ──────────────────────────────
    // "Today's day" resolution order: a day already locked today → the
    // recommended next-in-cycle day → fall back to day 1. Returns null when
    // no split has been set up yet.
    function getTodaysDayNum(split) {
      if (!split || !split.length) return null;
      const streak = readStreak();
      if (streak && streak.lastDate === todayKey() && streak.lastDayNum) {
        return Math.min(streak.lastDayNum, split.length);
      }
      const rec = getRecommendedDay(split.length);
      return rec || 1;
    }
    // Counts logged sets vs total prescribed sets for a given day on today's
    // date. Used by the widget's progress sub-line.
    function getDayProgress(dayNum, day) {
      if (!day || !Array.isArray(day.exercises)) return { logged: 0, total: 0 };
      let total = 0;
      for (const ex of day.exercises) total += parseInt(ex.sets, 10) || 0;
      let logged = 0;
      try {
        const raw = localStorage.getItem(SESSION_PREFIX + todayKey() + '.' + dayNum);
        if (raw) {
          const session = JSON.parse(raw);
          for (const exId of Object.keys(session || {})) {
            const sets = (session[exId] && session[exId].sets) || [];
            for (const s of sets) if (s && s.done) logged++;
          }
        }
      } catch {}
      return { logged, total };
    }

    // ── Data layer ─────────────────────────────────────────────────────────
    function getSplit() {
      try {
        const raw = localStorage.getItem(SPLIT_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          // Migrate: ensure each day has category + exercises[]
          return arr.map(d => ({
            name: d.name || 'Day',
            type: d.type || 'HEAVY',
            category: d.category || detectCategory(d.name, d.type),
            exercises: Array.isArray(d.exercises) ? d.exercises : [],
          }));
        }
      } catch {}
      return null;
    }
    function saveSplit(days) {
      tryWrite(SPLIT_KEY, JSON.stringify(days));
    }
    function setLocked(v) {
      if (v) tryWrite(SPLIT_LOCKED_KEY, '1');
      else   localStorage.removeItem(SPLIT_LOCKED_KEY);
    }
    function getPickedDay() {
      if (localStorage.getItem(PICKED_DATE_KEY) !== todayKey()) return null;
      const n = parseInt(localStorage.getItem(PICKED_DAY_KEY), 10);
      return isNaN(n) ? null : n;
    }
    function setPickedDay(dayNum) {
      tryWrite(PICKED_DAY_KEY, String(dayNum));
      tryWrite(PICKED_DATE_KEY, todayKey());
    }
    function clearPickedDay() {
      localStorage.removeItem(PICKED_DAY_KEY);
      localStorage.removeItem(PICKED_DATE_KEY);
    }

    function sessionKey(dayNum, date) { return SESSION_PREFIX + (date || todayKey()) + '.' + dayNum; }
    function getSession(dayNum) {
      try { return JSON.parse(localStorage.getItem(sessionKey(dayNum)) || '{}'); } catch { return {}; }
    }
    function isSessionLocked(dayNum) {
      // A session is locked once it's been submitted (a COMPLETED record exists).
      // Locked sessions are immutable — the only way to edit is to delete the
      // completed flag (which unlocks for re-entry).
      return !!getCompleted(dayNum);
    }
    function saveSession(dayNum, sess) {
      if (isSessionLocked(dayNum)) return; // hard guard against post-submit mutations
      tryWrite(sessionKey(dayNum), JSON.stringify(sess));
    }
    function getHistory(exId) {
      try { return JSON.parse(localStorage.getItem(HISTORY_PREFIX + exId) || 'null'); } catch { return null; }
    }
    function saveHistory(exId, snapshot) {
      tryWrite(HISTORY_PREFIX + exId, JSON.stringify(snapshot));
    }
    function commitHistory(exId, sets) {
      const done = sets.filter(s => s && s.done && parseFloat(s.wt) > 0);
      if (!done.length) return;
      const topWeight = Math.max(...done.map(s => parseFloat(s.wt)));
      const topReps   = Math.max(...done.map(s => parseInt(s.reps, 10) || 0));
      const volume    = done.reduce((sum, s) => sum + (parseFloat(s.wt) * (parseInt(s.reps, 10) || 0)), 0);
      saveHistory(exId, {
        date: todayKey(),
        topWeight,
        topReps,
        sets: sets.map(s => ({ wt: s?.wt || '', reps: s?.reps || '', done: !!s?.done, missed: !!s?.missed })),
      });
      appendHistoryLog(exId, { date: todayKey(), topWeight, topReps, volume: Math.round(volume) });
    }

    function getHistoryLog(exId) {
      try { return JSON.parse(localStorage.getItem(HISTLOG_PREFIX + exId) || '[]'); } catch { return []; }
    }
    // Only sessions from the SAME dayNum's rotation (excludes overlap when the
    // same exercise appears on multiple days, e.g. seated_leg_curl on day 3 + 6).
    // Detected by checking the matching COMPLETED flag for that date + dayNum.
    function getDayHistory(exId, dayNum) {
      const log = getHistoryLog(exId);
      if (!dayNum) return log;
      return log.filter(entry =>
        !!localStorage.getItem(COMPLETED_PREFIX + entry.date + '.' + dayNum)
      );
    }
    function saveHistoryLog(exId, arr) {
      tryWrite(HISTLOG_PREFIX + exId, JSON.stringify(arr));
    }
    function appendHistoryLog(exId, entry) {
      const log = getHistoryLog(exId);
      const idx = log.findIndex(e => e.date === entry.date);
      if (idx >= 0) log[idx] = entry;
      else log.push(entry);
      log.sort((a, b) => a.date.localeCompare(b.date));
      // Cap to most recent 26 entries (~6 months of weekly sessions)
      saveHistoryLog(exId, log.slice(-500));
    }

    function completedKey(dayNum, date) { return COMPLETED_PREFIX + (date || todayKey()) + '.' + dayNum; }
    function getCompleted(dayNum) {
      try { return JSON.parse(localStorage.getItem(completedKey(dayNum)) || 'null'); } catch { return null; }
    }
    function markCompleted(dayNum, payload) {
      tryWrite(completedKey(dayNum), JSON.stringify(payload));
    }
    function deleteCompleted(dayNum) { localStorage.removeItem(completedKey(dayNum)); }

    // ── Cardio (per-day-per-date) ──────────────────────────────────────────
    const CARDIO_TYPES = [
      { id: 'treadmill',  name: 'Treadmill' },
      { id: 'bike',       name: 'Stationary bike' },
      { id: 'rower',      name: 'Rower' },
      { id: 'elliptical', name: 'Elliptical' },
      { id: 'stair',      name: 'Stair climber' },
      { id: 'run',        name: 'Outdoor run' },
      { id: 'walk',       name: 'Outdoor walk' },
      { id: 'cycle',      name: 'Outdoor cycling' },
      { id: 'swim',       name: 'Swimming' },
      { id: 'jump',       name: 'Jump rope' },
      { id: 'hike',       name: 'Hike' },
      { id: 'custom',     name: 'Custom cardio…' },
    ];
    function cardioKey(dayNum, date) { return CARDIO_PREFIX + (date || todayKey()) + '.' + dayNum; }
    function getCardio(dayNum) {
      try { return JSON.parse(localStorage.getItem(cardioKey(dayNum)) || 'null'); } catch { return null; }
    }
    function saveCardio(dayNum, data) {
      if (isSessionLocked(dayNum)) return; // cardio locks with the workout
      if (!data || !data.done) {
        localStorage.removeItem(cardioKey(dayNum));
      } else {
        tryWrite(cardioKey(dayNum), JSON.stringify(data));
      }
    }

    function renderCardioCardHTML(dayNum, locked) {
      const cardio = getCardio(dayNum) || { done: false, type: 'treadmill', totalMinutes: '', customName: '', zones: {} };
      const isDone = !!cardio.done;
      const dis = locked ? ' disabled' : '';

      const typeOptions = CARDIO_TYPES.map(c =>
        `<option value="${c.id}" ${cardio.type === c.id ? 'selected' : ''}>${esc(c.name)}</option>`
      ).join('');

      const customNameRow = (isDone && cardio.type === 'custom') ? `
        <div class="cardio-row">
          <label>Name</label>
          <input type="text" id="cardio-custom-name" placeholder="e.g. Mountain biking" value="${esc(cardio.customName || '')}"${dis} />
        </div>` : '';

      const zonesRows = ['z1','z2','z3','z4','z5'].map(z => `
        <div class="cardio-zone-row">
          <span class="cardio-zone-label">${z.toUpperCase()}</span>
          <input type="text" inputmode="numeric" data-cardio-zone="${z}" placeholder="0"
                 value="${(cardio.zones && cardio.zones[z]) || ''}"${dis} />
          <span class="cardio-zone-unit">min</span>
        </div>`).join('');

      const expandHTML = isDone ? `
        <div class="cardio-expand">
          <div class="cardio-row">
            <label>Type</label>
            <select id="cardio-type"${dis}>${typeOptions}</select>
          </div>
          ${customNameRow}
          <div class="cardio-row">
            <label>Total time</label>
            <input type="text" inputmode="numeric" id="cardio-minutes" placeholder="min"
                   value="${esc(String(cardio.totalMinutes || ''))}"${dis} />
            <span class="cardio-unit">min</span>
          </div>
          <div class="cardio-zones-label">Zones <span class="cardio-zones-opt">optional</span></div>
          <div class="cardio-zones">${zonesRows}</div>
        </div>` : '';

      return `
        <div class="home-divider"><span>CARDIO</span></div>
        <div class="cardio-card${isDone ? ' done' : ''}">
          <label class="cardio-check">
            <input type="checkbox" id="cardio-check" ${isDone ? 'checked' : ''}${dis} />
            <span class="cardio-check-box">${isDone ? '✓' : ''}</span>
            <span class="cardio-check-label">${isDone ? 'Cardio logged' : 'Did cardio today?'}</span>
          </label>
          ${expandHTML}
        </div>`;
    }

    function attachCardioHandlers(dayNum) {
      const cardioCheck = document.getElementById('cardio-check');
      if (cardioCheck) {
        cardioCheck.addEventListener('change', () => {
          if (isSessionLocked(dayNum)) return;
          const data = getCardio(dayNum) || {};
          data.done = cardioCheck.checked;
          if (data.done && !data.type) data.type = 'treadmill';
          saveCardio(dayNum, data);
          renderSplit();
        });
      }
      const cardioType = document.getElementById('cardio-type');
      if (cardioType) {
        cardioType.addEventListener('change', () => {
          if (isSessionLocked(dayNum)) return;
          const data = getCardio(dayNum) || { done: true };
          data.type = cardioType.value;
          if (data.type !== 'custom') delete data.customName;
          saveCardio(dayNum, data);
          renderSplit(); // re-render to show/hide custom name field
        });
      }
      const cardioMins = document.getElementById('cardio-minutes');
      if (cardioMins) {
        cardioMins.addEventListener('input', () => {
          if (isSessionLocked(dayNum)) return;
          const data = getCardio(dayNum) || { done: true };
          const v = parseInt(cardioMins.value, 10);
          data.totalMinutes = isNaN(v) ? '' : v;
          saveCardio(dayNum, data);
        });
      }
      const cardioCustomName = document.getElementById('cardio-custom-name');
      if (cardioCustomName) {
        cardioCustomName.addEventListener('input', () => {
          if (isSessionLocked(dayNum)) return;
          const data = getCardio(dayNum) || { done: true, type: 'custom' };
          data.customName = cardioCustomName.value;
          saveCardio(dayNum, data);
        });
      }
      document.querySelectorAll('[data-cardio-zone]').forEach(inp => {
        inp.addEventListener('input', () => {
          if (isSessionLocked(dayNum)) return;
          const data = getCardio(dayNum) || { done: true };
          data.zones = data.zones || {};
          const v = parseInt(inp.value, 10);
          data.zones[inp.dataset.cardioZone] = isNaN(v) ? 0 : v;
          saveCardio(dayNum, data);
        });
      });
    }

    // ── Numeric helpers ────────────────────────────────────────────────────
    function parseRepsTarget(reps) {
      const m = String(reps).match(/(\d+)/);
      return m ? parseInt(m[1], 10) : '';
    }
    function round25(w) { return Math.round(w * 2 / 5) * 2.5; }

    // ── Per-exercise intensity tier ────────────────────────────────────────
    // heavy_compound: barbell main lifts, weighted BW pull/dip
    // compound:       DBs, machines, cables, bodyweight unloaded
    // heavy_iso:      barbell curls, skullcrushers
    // iso:            cable / DB isolation work
    // ab:             core / midline
    const EX_TIER = {
      // Heavy compounds
      bench_bb:'heavy_compound', incl_bb_bench:'heavy_compound',
      standing_ohp:'heavy_compound', push_press:'heavy_compound',
      back_squat:'heavy_compound', front_squat:'heavy_compound',
      rdl:'heavy_compound', conv_dl:'heavy_compound',
      bb_row:'heavy_compound', pendlay_row:'heavy_compound', t_bar_row:'heavy_compound',
      pullup_weighted:'heavy_compound', dips_weighted:'heavy_compound',
      // Mid compounds
      flat_db_press:'compound', incl_db_press:'compound', seated_db_ohp:'compound',
      machine_chest:'compound', machine_ohp:'compound',
      leg_press:'compound', hack_squat:'compound',
      bulgarian_ss:'compound', db_split_squat:'compound', walking_lunge:'compound',
      seated_cable_row:'compound', chest_supp_row:'compound', single_arm_row:'compound',
      lat_pulldown:'compound', pullup:'compound', close_grip:'compound',
      hip_thrust:'compound',
      // Heavy isolation
      bb_curl:'heavy_iso', skullcrushers:'heavy_iso',
      // Standard isolation
      cable_fly:'iso', pec_deck:'iso',
      db_lat_raise:'iso', cable_lat_raise:'iso', rear_delt_fly:'iso', reverse_pec:'iso',
      tri_pushdown:'iso', oh_tri_ext:'iso',
      hammer_curl:'iso', cable_curl:'iso', incl_db_curl:'iso', preacher_curl:'iso',
      face_pull:'iso',
      leg_ext:'iso', seated_leg_curl:'iso', lying_leg_curl:'iso', calf_raise:'iso',
      // Abs / core
      cable_crunch:'ab', hang_leg_raise:'ab', ab_wheel:'ab',
      weighted_situp:'ab', decline_situp:'ab', russian_twist:'ab', toes_to_bar:'ab', plank:'ab',
    };

    // Research-backed rest (seconds) by tier × day type
    // Heavy compounds 3-5min (de Salles 2009; Schoenfeld 2016)
    // Isolations 1-2min (lower neuromuscular fatigue)
    // Volume days run shorter to drive density / metabolic stress
    const REST_BY_TIER = {
      heavy_compound: { HEAVY: 210, VOLUME: 150, RECOVERY: 90 },
      compound:       { HEAVY: 150, VOLUME: 120, RECOVERY: 90 },
      heavy_iso:      { HEAVY: 105, VOLUME: 75,  RECOVERY: 60 },
      iso:            { HEAVY: 75,  VOLUME: 60,  RECOVERY: 45 },
      ab:             { HEAVY: 60,  VOLUME: 45,  RECOVERY: 45 },
    };

    // Warm-up scheme per tier — percentages of top working weight
    const WARMUP_BY_TIER = {
      heavy_compound: 'full',   // 50% × 8, 70% × 5, 85% × 3
      compound:       'short',  // 50% × 8, 75% × 4
      heavy_iso:      'one',    // 50% × 8
      iso:            'skip',
      ab:             'skip',
    };

    function exTier(exId) {
      return EX_TIER[exId] || 'compound'; // custom exercises default to compound
    }
    function optimalRestFor(exId, dayType) {
      const tier = exTier(exId);
      const map = REST_BY_TIER[tier] || REST_BY_TIER.compound;
      return map[dayType] || map.HEAVY;
    }
    function warmupModeFor(exId) {
      return WARMUP_BY_TIER[exTier(exId)] || 'short';
    }

    function computeWarmup(workingWeight, exId) {
      const mode = warmupModeFor(exId);
      if (mode === 'skip') return null;
      const w = parseFloat(workingWeight);
      if (!w || w < 20) return null; // light enough to skip
      if (mode === 'full') {
        return [
          { w: round25(w * 0.50), reps: 8 },
          { w: round25(w * 0.70), reps: 5 },
          { w: round25(w * 0.85), reps: 3 },
        ];
      }
      if (mode === 'short') {
        return [
          { w: round25(w * 0.50), reps: 8 },
          { w: round25(w * 0.75), reps: 4 },
        ];
      }
      if (mode === 'one') {
        return [{ w: round25(w * 0.50), reps: 8 }];
      }
      return null;
    }
    function formatHistDate(d) {
      const parts = String(d).split('-').map(Number);
      if (parts.length !== 3) return d;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return months[parts[1] - 1] + ' ' + parts[2];
    }
    function restFor(sets, reps) {
      // Heuristic to match the main app's rest cadence (3:00 heavy, 2:30 strength, 1:30 hypertrophy, 1:00 iso)
      const r = parseRepsTarget(reps) || 10;
      if (r <= 5 && sets >= 4) return 180;
      if (r <= 6) return 150;
      if (r <= 8) return 120;
      if (r <= 12) return 90;
      return 60;
    }
    function formatRest(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ':' + String(sec).padStart(2, '0');
    }

    // ── DB-aware weight formatter ──────────────────────────────────────────
    function isPerDb(exId) {
      const ex = EX[exId];
      if (!ex) return false;
      // Match any exercise whose name has "DB" as a word, plus a couple of implicit DB lifts
      return /\bDB\b/.test(ex.name) || exId === 'hammer_curl';
    }
    function fmtKg(n, exId) {
      const v = parseFloat(n);
      if (!Number.isFinite(v) || v < 0) return '—';
      // Trim trailing .0 (e.g. "80.0" → "80") but preserve real decimals (80.5 → "80.5")
      const txt = (v % 1 === 0) ? String(v) : String(v);
      return txt + 'kg' + (isPerDb(exId) ? ' ea' : '');
    }

    // ── Style helpers ──────────────────────────────────────────────────────
    function tagClass(type) {
      switch ((type || '').toUpperCase()) {
        case 'HEAVY':    return 'tag-heavy';
        case 'VOLUME':   return 'tag-medium';
        case 'RECOVERY': return 'tag-rest';
        default:         return 'tag-light';
      }
    }
    function tagLabel(type) {
      switch ((type || '').toUpperCase()) {
        case 'HEAVY':    return 'HEAVY';
        case 'VOLUME':   return 'VOLUME';
        case 'RECOVERY': return 'REST';
        default:         return (type || '').toUpperCase();
      }
    }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Top-level view state ───────────────────────────────────────────────
    // 'picker' (grid) | 'logger' (selected day)
    // Widget mode (view: 'today') wraps this with a compact card; tapping the
    // card sets _widgetExpanded=true and falls through to the same flow below.
    function toggleWidgetMode(showCollapsed /*, inWidgetMode */) {
      const widgetHost   = document.getElementById('widget-host');
      const appHeader    = document.querySelector('.app-header');
      const splitSection = document.getElementById('split-section');
      const banner       = document.getElementById('demo-banner-slot');
      // Inline style toggles — beats the `hidden` attribute which gets
      // overridden by class-level `display: flex` declarations.
      if (widgetHost)   widgetHost.hidden = !showCollapsed;
      if (appHeader)    appHeader.style.display    = showCollapsed ? 'none' : '';
      if (splitSection) splitSection.style.display = showCollapsed ? 'none' : '';
      if (banner)       banner.style.display       = showCollapsed ? 'none' : '';
    }
    // Widget tap: one-way expand. We don't render a collapse affordance since
    // (a) the gear opens settings and (b) the user can navigate back through
    // the normal logger ← / Change buttons inside the expanded UI.
    function expandWidget() { _widgetExpanded = true; renderSplit(); }

    function renderSplit() {
      // Widget-mode collapsed: render the compact card and return early.
      const inWidgetMode = (_SL_VIEW === 'today');
      const showCollapsed = inWidgetMode && !_widgetExpanded;
      toggleWidgetMode(showCollapsed, inWidgetMode);
      if (showCollapsed) { renderWidget(); return; }

      const section = document.getElementById('split-section');
      const split = getSplit();
      const picked = getPickedDay();
      // Refresh DEMO badge state every render — clears once user-driven activity is detected.
      if (typeof refreshDemoBadge === 'function') refreshDemoBadge();

      if (!split || !Array.isArray(split) || !split.length) {
        // Recovery path: if setup was previously marked complete but the split
        // is missing/corrupted, drop the flag so the user lands cleanly in the
        // welcome flow instead of a stuck broken state. NEVER wipes user data.
        if (isSetupComplete()) clearSetupComplete();
        const profile = getProfile();
        const tailorLabel = profile
          ? `Update profile · ${profile.weight}kg ${profile.gender === 'f' ? 'F' : 'M'} ${profile.level}`
          : 'Tailor my starting weights';
        // iOS Safari (not yet installed) gets a 'Add to Home Screen' hint
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
                           || (window.navigator && window.navigator.standalone === true);
        const installHint = (isIOS && !isStandalone)
          ? `<div class="install-hint">📱 <strong>Tip:</strong> tap Share → Add to Home Screen to use this like an app — opens fullscreen, works offline.</div>`
          : '';
        section.innerHTML = `
          <div class="empty-hero">
            <div class="empty-hero-tag">GET STARTED</div>
            <div class="empty-hero-title">Build your training week</div>
            <div class="empty-hero-sub">Start from a preset or build day by day. Mark each day heavy or volume — rest times tune themselves. Pick your exercises, then log every set as you train.</div>
            <button class="empty-hero-cta" id="empty-hero-start">Customize split →</button>
            <button class="empty-hero-secondary" id="empty-hero-tailor">${esc(tailorLabel)}</button>
            ${installHint}
          </div>`;
        const startBtn = document.getElementById('empty-hero-start');
        if (startBtn) startBtn.addEventListener('click', openSplitEditor);
        const tailorBtn = document.getElementById('empty-hero-tailor');
        if (tailorBtn) tailorBtn.addEventListener('click', openTailorModal);
        return;
      }

      if (picked != null) {
        // Tap-to-summary flow: a day tile tap lands here with _loggerActive=false,
        // showing a "you picked Day N" confirmation card. The user explicitly
        // opens the logger from there (or hits Change to go back to the grid).
        // Already-submitted days skip the summary — they jump straight to the
        // locked card so the user can edit/delete/log cardio without an extra
        // tap. Same for rest days where there's no separate logger UI.
        const day = split[picked - 1];
        const isRest = day && day.category === 'rest';
        const alreadyCompleted = !!getCompleted(picked);
        if (_loggerActive || alreadyCompleted || isRest) {
          renderLogger(section, split, picked);
        } else {
          renderDaySummary(section, split, picked);
        }
      } else {
        renderPicker(section, split);
      }
    }

    // In-memory flag — toggled to true when the user taps "Open Logger" on the
    // summary card. Resets on reload (refresh while in logger lands on summary,
    // which is fine: one tap re-enters). Cleared whenever pickedDay clears.
    let _loggerActive = false;

    function renderDaySummary(section, split, dayNum) {
      const day = split[dayNum - 1];
      if (!day) { clearPickedDay(); renderSplit(); return; }
      const n = String(dayNum).padStart(2, '0');
      const streak = computeStreak();
      const completed = !!getCompleted(dayNum);
      const streakRow = streak.count > 0
        ? `<div class="session-card-streak">
             <span class="streak-emoji">🔥</span>
             <span class="streak-count">${streak.count}</span>
             <span class="streak-label">day streak</span>
           </div>`
        : '';
      section.innerHTML = `
        <div class="session-card">
          <div class="session-card-label">
            ${completed ? '✓ ' : ''}Day ${n}
            <span class="day-tile-tag ${tagClass(day.type)}">${tagLabel(day.type)}</span>
          </div>
          <div class="session-card-name">${esc(day.name)}</div>
          ${streakRow}
          <div class="session-card-actions">
            <button class="session-card-btn-primary" id="session-open">Open Logger</button>
            <button class="session-card-btn-secondary" id="session-change">Change</button>
          </div>
        </div>`;
      document.getElementById('session-open').addEventListener('click', () => {
        _loggerActive = true;
        renderSplit();
      });
      document.getElementById('session-change').addEventListener('click', () => {
        _loggerActive = false;
        clearPickedDay();
        renderSplit();
      });
    }

    // ── Widget renderer (view: 'today' collapsed) ───────────────────────────
    function renderWidgetGearSvg() {
      return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>`;
    }
    function renderWidgetGear() {
      // Gear with sync-dot reuses the same .sync-dot class so updateSyncDot
      // (now iterating all .sync-dot elements) updates this one too.
      return `<button class="widget-gear" id="widget-open-settings" aria-label="Settings" title="Settings">
        ${renderWidgetGearSvg()}
        <span class="sync-dot local widget-sync-dot" aria-hidden="true"></span>
      </button>`;
    }

    function renderWidget() {
      const host = document.getElementById('widget-host');
      if (!host) return;
      const split = getSplit();

      // 1. Signed-out, supabase configured → compact sign-in prompt.
      if (supabase && !session && !inheritedFromParent) {
        host.innerHTML = `
          <div class="widget-card">
            ${renderWidgetGear()}
            <div class="widget-day-num">Sync</div>
            <div class="widget-day-name">Sign in to sync your workouts</div>
            <div class="widget-signin">
              <input class="widget-signin-input" id="widget-email" type="email" placeholder="you@example.com" autocomplete="email" />
              <button class="widget-signin-btn" id="widget-send-link">Send magic link</button>
              <div class="widget-signin-msg" id="widget-signin-msg"></div>
            </div>
          </div>`;
        wireWidgetGear();
        const sendBtn = document.getElementById('widget-send-link');
        if (sendBtn) sendBtn.addEventListener('click', async () => {
          const email = (document.getElementById('widget-email').value || '').trim();
          const msg = document.getElementById('widget-signin-msg');
          if (!/.+@.+\..+/.test(email)) {
            if (msg) { msg.textContent = 'Enter a valid email.'; msg.className = 'widget-signin-msg error'; }
            return;
          }
          sendBtn.disabled = true;
          if (msg) { msg.textContent = 'Sending magic link…'; msg.className = 'widget-signin-msg'; }
          try {
            const { error } = await supabase.auth.signInWithOtp({
              email,
              options: { emailRedirectTo: window.location.href.split('#')[0] },
            });
            if (error) throw error;
            if (msg) msg.textContent = 'Check your email.';
          } catch (e) {
            if (msg) { msg.textContent = (e && e.message) || 'Send failed.'; msg.className = 'widget-signin-msg error'; }
          } finally {
            sendBtn.disabled = false;
          }
        });
        if (typeof updateSyncDot === 'function') updateSyncDot();
        return;
      }

      // 2. No split yet → compact welcome card.
      if (!split || !Array.isArray(split) || !split.length) {
        host.innerHTML = `
          <button class="widget-card" id="widget-tap" aria-label="Build your training week">
            ${renderWidgetGear()}
            <div class="widget-day-num">Get started</div>
            <div class="widget-day-name">Build your training week</div>
            <div class="widget-tag-row">
              <span class="day-tile-tag tag-light">START</span>
            </div>
            <div class="widget-progress">Tap to set up your split</div>
          </button>`;
        wireWidgetCardTap();
        wireWidgetGear();
        if (typeof updateSyncDot === 'function') updateSyncDot();
        return;
      }

      // 3. Today's day card.
      const dayNum = getTodaysDayNum(split);
      const day = split[dayNum - 1];
      const n = String(dayNum).padStart(2, '0');
      const isRest = day && day.category === 'rest';
      const completed = !!getCompleted(dayNum);
      const exCount = (day && day.exercises || []).length;

      let progressLine;
      if (isRest) {
        progressLine = '<div class="widget-progress">Rest day · recovery focus</div>';
      } else if (completed) {
        progressLine = '<div class="widget-progress"><strong>✓ Logged today</strong></div>';
      } else {
        const p = getDayProgress(dayNum, day);
        if (p.total > 0 && p.logged > 0) {
          progressLine = `<div class="widget-progress">${exCount} exercises · <strong>${p.logged}/${p.total}</strong> sets logged today</div>`;
        } else {
          progressLine = `<div class="widget-progress">${exCount} exercises · tap to log</div>`;
        }
      }

      host.innerHTML = `
        <button class="widget-card${completed ? ' completed' : ''}" id="widget-tap" aria-label="Open Day ${n}: ${esc(day.name)}">
          ${renderWidgetGear()}
          <div class="widget-day-num">Day ${n}</div>
          <div class="widget-day-name">${esc(day.name)}</div>
          <div class="widget-tag-row">
            <span class="day-tile-tag ${tagClass(day.type)}">${tagLabel(day.type)}</span>
          </div>
          ${progressLine}
        </button>`;
      wireWidgetCardTap();
      wireWidgetGear();
      if (typeof updateSyncDot === 'function') updateSyncDot();
    }

    function wireWidgetCardTap() {
      const tap = document.getElementById('widget-tap');
      if (tap) tap.addEventListener('click', expandWidget);
    }
    function wireWidgetGear() {
      const gear = document.getElementById('widget-open-settings');
      if (gear) gear.addEventListener('click', (e) => {
        e.stopPropagation();
        openSettingsSheet();
      });
    }

    function renderPicker(section, split) {
      const recommended = getRecommendedDay(split.length);
      const tiles = split.map((d, i) => {
        const n = String(i + 1).padStart(2, '0');
        const dayNum = i + 1;
        const exCount = (d.exercises || []).length;
        const completed = !!getCompleted(dayNum);
        const isRec = recommended === dayNum;
        const exNote = d.category === 'rest'
          ? ''
          : `<div class="day-tile-count">${completed ? '✓ logged today' : (isRec ? 'Next up · tap to lock in' : (exCount ? exCount + ' exercises' : 'Tap to set up'))}</div>`;
        const editBtn = d.category === 'rest'
          ? ''
          : `<button class="day-tile-edit" data-edit-day="${dayNum}" title="Edit exercises &amp; weights" aria-label="Edit day ${n}">✎</button>`;
        const tileClass = ['day-tile'];
        if (completed) tileClass.push('completed');
        if (isRec)     tileClass.push('recommended');
        return `<div class="day-tile-wrap" style="position:relative;">
          <button class="${tileClass.join(' ')}" data-day="${dayNum}" aria-label="Day ${n}: ${esc(d.name)}">
            <div class="day-tile-num">Day ${n}</div>
            <div class="day-tile-name">${esc(d.name)}</div>
            <span class="day-tile-tag ${tagClass(d.type)}">${tagLabel(d.type)}</span>
            ${exNote}
            <div class="day-tile-check" aria-hidden="true">✓</div>
          </button>
          ${editBtn}
        </div>`;
      }).join('');

      // Picker view doesn't show the streak chip anymore — the streak lives
      // inside the session card after the user picks a day. Keeps the grid
      // visually quiet and avoids the previous animation interactions that
      // caused flicker on neighboring elements.
      section.innerHTML = `
        <div class="day-picker-grid">${tiles}</div>
        <div class="customize-link-row">
          <button class="customize-link" id="picker-customize-link">Customize split</button>
        </div>`;
      section.querySelectorAll('.day-tile').forEach(btn => {
        btn.addEventListener('click', () => onTileTap(btn, section));
      });
      section.querySelectorAll('.day-tile-edit').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          openExerciseWizard(parseInt(btn.dataset.editDay, 10));
        });
      });
      const custLink = document.getElementById('picker-customize-link');
      if (custLink) custLink.addEventListener('click', openSplitEditor);
    }

    function onTileTap(btn, section) {
      const dayNum = parseInt(btn.dataset.day, 10);

      // Lock-in: bumps the streak counter per the rules in lockDayIn().
      // Idempotent within the same calendar day.
      lockDayIn(dayNum);

      // Phase 1 (0 → 450ms): highlight tapped tile, dim the rest, fade in
      // the ✓ check inside the tile. The tile's CSS handles the visuals.
      btn.classList.add('selecting');
      section.querySelectorAll('.day-tile').forEach(t => {
        if (t !== btn) t.classList.add('dimmed');
      });

      // Phase 2 (after 450ms): fade the whole grid out before we swap views.
      setTimeout(() => {
        const grid = section.querySelector('.day-picker-grid');
        if (grid) {
          grid.style.transition = 'opacity 0.3s var(--spring)';
          grid.style.opacity = '0';
        }

        // Phase 3 (350ms later): commit picked day, drop into session card.
        setTimeout(() => {
          setPickedDay(dayNum);
          _loggerActive = false; // fresh tap always lands on the summary
          renderSplit();
        }, 350);
      }, 450);
    }

    // ── Logger view (per day) ──────────────────────────────────────────────
    function renderLogger(section, split, dayNum) {
      const day = split[dayNum - 1];
      if (!day) { clearPickedDay(); renderSplit(); return; }

      const n = String(dayNum).padStart(2, '0');

      // Rest day shortcut — cardio is the only thing loggable
      if (day.category === 'rest') {
        section.innerHTML = `
          <div class="locked-card">
            <div class="locked-day-label">
              ✓ Day ${n}
              <span class="day-tile-tag ${tagClass(day.type)}">${tagLabel(day.type)}</span>
            </div>
            <div class="locked-day-name">${esc(day.name)}</div>
            <div style="font-size:13px;color:rgba(255,255,255,.55);">Rest day — no lifting. Log cardio below if you did some.</div>
            <div class="locked-actions">
              <button class="locked-btn-secondary" id="logger-back">Change</button>
            </div>
          </div>
          ${renderCardioCardHTML(dayNum, false)}`;
        document.getElementById('logger-back').addEventListener('click', () => {
          clearPickedDay();
          renderSplit();
        });
        attachCardioHandlers(dayNum);
        return;
      }

      const exercises = day.exercises || [];

      // No exercises set up yet — still allow cardio logging
      if (!exercises.length) {
        section.innerHTML = `
          <div class="needs-setup-banner">
            <div class="needs-setup-text">
              <strong>Day ${n} · ${esc(day.name)}</strong> has no exercises yet. Build it from recommendations.
            </div>
            <button class="needs-setup-btn" id="setup-now">Set up exercises →</button>
          </div>
          ${renderCardioCardHTML(dayNum, false)}
          <div class="locked-actions">
            <button class="locked-btn-secondary" id="logger-back">Back</button>
          </div>`;
        document.getElementById('setup-now').addEventListener('click', () => {
          openExerciseWizard(dayNum);
        });
        document.getElementById('logger-back').addEventListener('click', () => {
          clearPickedDay();
          renderSplit();
        });
        attachCardioHandlers(dayNum);
        return;
      }

      const session = getSession(dayNum);
      const completed = getCompleted(dayNum);
      const locked = !!completed;

      const exCards = exercises.map((e) => {
        const ex = EX[e.id];
        if (!ex) return '';
        const targetSets = e.sets || ex.sets;
        const targetReps = e.reps || ex.reps;
        const targetRepsN = parseRepsTarget(targetReps);

        // Session-scoped swap (today only): session._swaps[slotId] = altId
        // Sets, history, warmup, rest, tailor estimate all use the EFFECTIVE id.
        // Only the swap button knows about the slot's original id.
        const swappedTo = (session._swaps || {})[e.id];
        const effId = swappedTo || e.id;
        const effEx = EX[effId] || ex;
        const isSwapped = !!swappedTo;

        // Pull/normalize session state — keyed by effective id
        let exState = session[effId] || { sets: [] };
        while (exState.sets.length < targetSets) exState.sets.push({});
        exState.sets = exState.sets.slice(0, targetSets);

        // History (prior session, different date than today) — effective id
        const hist = getHistory(effId);
        const priorTopWeight = hist ? hist.topWeight : null;
        const priorTopReps   = hist ? hist.topReps   : null;
        const hasPrior = hist && hist.date !== todayKey();

        // Default weight: slot default (only when not swapped) → prior top → tailor → empty
        const tailorEst = tailorEstimate(effId);
        const defaultWtStr = (!isSwapped && e.defaultWeight != null && e.defaultWeight !== '')
          ? String(e.defaultWeight)
          : (priorTopWeight != null ? String(priorTopWeight)
          : (tailorEst != null && tailorEst > 0 ? String(tailorEst) : ''));

        // Working weight for warmup base: typed first-set weight → default → empty
        const firstWtRaw = exState.sets[0]?.wt;
        const firstWt = parseFloat(firstWtRaw) || parseFloat(defaultWtStr) || 0;
        const warmup = computeWarmup(firstWt, effId);

        // Clean = all sets done with reps ≥ target (or AMRAP done)
        const allClean = exState.sets.length === targetSets &&
          exState.sets.every(s => s && s.done && parseFloat(s.wt) > 0 &&
            (targetRepsN ? (parseInt(s.reps, 10) || 0) >= targetRepsN : true));

        const clockIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
        const lastHTML = hasPrior
          ? `<div class="last-row"><strong>LAST:</strong> <span class="val has">${fmtKg(priorTopWeight, effId)} × ${priorTopReps} · ${formatHistDate(hist.date)}</span><button class="last-pencil" data-history-ex="${effId}" title="Past sessions" aria-label="Past sessions">${clockIcon}</button></div>`
          : `<div class="last-row"><strong>LAST:</strong> <span class="val">no prior session</span><button class="last-pencil" data-history-ex="${effId}" title="Past sessions" aria-label="Past sessions">${clockIcon}</button></div>`;

        const wuMode = warmupModeFor(effId);
        const wuTargetVal = (!isSwapped && e.defaultWeight != null && e.defaultWeight !== '')
          ? String(e.defaultWeight)
          : (firstWt > 0 ? String(firstWt) : '');
        const wuTargetPlaceholder = priorTopWeight ? String(priorTopWeight) : '—';
        const wuDis = locked ? ' disabled' : '';
        const warmupHTML = (wuMode === 'skip') ? '' : `
          <div class="warmup-header">
            <span class="warmup-label">WARM-UP · CALC FOR</span>
            <input class="wu-target-input" type="text" inputmode="decimal"
                   data-wu-target="${effId}"${!isSwapped ? ` data-wu-slot="${e.id}"` : ''}
                   placeholder="${esc(wuTargetPlaceholder)}"
                   value="${esc(wuTargetVal)}"${wuDis} />
            <span class="wu-target-unit">${isPerDb(effId) ? 'kg ea' : 'kg'}</span>
          </div>
          <div class="warmup-grid" data-warmup-grid="${effId}">
            ${warmup ? warmup.map((w, i) => `
              <div class="wu-tag">W${i+1}</div>
              <div class="wu-wt">${fmtKg(w.w, effId)}</div>
              <div class="wu-reps">×${w.reps}</div>
            `).join('') : ''}
          </div>`;

        const disAttr = locked ? ' disabled' : '';
        const setCells = exState.sets.map((s, i) => {
          const stored = (s && s.wt != null && s.wt !== '') ? s.wt : '';
          const placeholder = stored ? '' : (defaultWtStr || '—');
          const wtVal = stored;
          const repsStored = (s && s.reps != null && s.reps !== '') ? s.reps : '';
          const repsPlaceholder = repsStored ? '' : String(targetRepsN || '—');
          const missCls = (s && s.missed) ? ' missed' : '';
          const doneCls = (s && s.done)   ? ' done'   : '';
          return `
            <div class="set-num">${i + 1}</div>
            <input class="set-input${missCls}" type="text" inputmode="decimal" placeholder="${esc(placeholder)}"
                   data-ex="${effId}" data-set="${i}" data-field="wt"   value="${esc(wtVal)}"${disAttr} />
            <input class="set-input${missCls}" type="text" inputmode="numeric" placeholder="${esc(repsPlaceholder)}"
                   data-ex="${effId}" data-set="${i}" data-field="reps" value="${esc(repsStored)}"${disAttr} />
            <button class="set-check-btn${doneCls}" data-ex="${effId}" data-set="${i}" data-action="done"${disAttr}>✓</button>
            <button class="set-miss-btn${missCls}"  data-ex="${effId}" data-set="${i}" data-action="miss"${disAttr}>×</button>
          `;
        }).join('');

        const restSec = e.rest || optimalRestFor(effId, day.type);
        const restIsCustom = !!e.rest;
        const metaLine = `${targetSets} × ${esc(targetReps)} · <button class="rest-edit-btn${restIsCustom ? ' custom' : ''}" data-rest-edit data-ex="${e.id}" title="Tap to adjust rest">rest ${formatRest(restSec)}</button>`;

        const swapBadge = isSwapped
          ? `<div class="ex-swap-badge" title="Today only">↻ swap from <strong>${esc(ex.name)}</strong></div>`
          : '';

        return `<div class="ex-card${allClean ? ' clean' : ''}${isSwapped ? ' swapped' : ''}">
          <div class="ex-card-header">
            <div class="ex-card-name-block">
              <div class="ex-card-name">${esc(effEx.name)}${allClean ? ' <span class="star">★</span>' : ''}</div>
              ${swapBadge}
              <div class="ex-card-meta">${metaLine}</div>
            </div>
            <div class="ex-actions">
              <button class="ex-action-btn" data-ex-action="info" data-ex="${effId}" title="Info" aria-label="Info">i</button>
              <button class="ex-action-btn${isSwapped ? ' is-swapped' : ''}" data-ex-action="swap" data-ex="${e.id}" title="Swap" aria-label="Swap">⇄</button>
              <button class="ex-action-btn" data-ex-action="chart" data-ex="${effId}" title="History" aria-label="History">↗</button>
            </div>
          </div>
          ${lastHTML}
          ${warmupHTML}
          <div class="set-grid">
            <div class="set-grid-h">Set</div>
            <div class="set-grid-h">${isPerDb(effId) ? 'Wt (ea)' : 'Wt'}</div>
            <div class="set-grid-h">Reps</div>
            <div class="set-grid-h">✓</div>
            <div class="set-grid-h">×</div>
            ${setCells}
          </div>
        </div>`;
      }).join('');

      const bannerHTML = locked ? `
        <div class="completed-banner">
          <div class="completed-banner-text">
            <strong>✓ Workout logged · ${esc(formatHistDate(completed.date))}</strong><br>
            Data locked. Delete to edit.
          </div>
          <button class="completed-banner-delete" id="logger-delete">Delete</button>
        </div>` : '';

      // Pre-fill banner: most recent history date across this day's exercises
      let prefillDate = '';
      if (!locked) {
        for (const e of exercises) {
          const h = getHistory(e.id);
          if (h && h.date && h.date > prefillDate) prefillDate = h.date;
        }
      }
      const prefillHTML = (!locked && prefillDate) ? `
        <div class="prefill-banner">
          Weights pre-filled from <strong>${esc(formatHistDate(prefillDate))}</strong> · tap any field to override
        </div>` : '';

      const submitHTML = locked ? '' : `<button class="submit-workout" id="logger-submit">Submit workout</button>`;

      section.innerHTML = `
        <div class="logger-card" style="position:relative;">
          <button class="logger-back-arrow" id="logger-back" aria-label="Back to split">←</button>
          <div class="logger-day-header">
            <div class="logger-day-num">
              Day ${n}
              <span class="day-tile-tag ${tagClass(day.type)}">${tagLabel(day.type)}</span>
            </div>
            <div class="logger-day-name-big">${esc(day.name)}</div>
          </div>
          ${bannerHTML}
          ${prefillHTML}
          ${exCards}
          ${renderCardioCardHTML(dayNum, locked)}
          ${submitHTML}
          <div class="logger-actions" style="margin-top: 10px;">
            ${locked ? '' : `
              <button class="locked-btn-secondary" id="logger-edit">Edit exercises</button>
              <button class="locked-btn-secondary" id="logger-reset">Reset today</button>
            `}
          </div>
        </div>`;

      document.getElementById('logger-back').addEventListener('click', () => {
        clearPickedDay();
        renderSplit();
      });
      attachCardioHandlers(dayNum);
      const loggerEditBtn = document.getElementById('logger-edit');
      if (loggerEditBtn) loggerEditBtn.addEventListener('click', () => {
        if (isSessionLocked(dayNum)) return;
        openExerciseWizard(dayNum);
      });
      const loggerResetBtn = document.getElementById('logger-reset');
      if (loggerResetBtn) loggerResetBtn.addEventListener('click', () => {
        if (isSessionLocked(dayNum)) return; // delete first
        if (!confirm('Clear today\'s log for this day?')) return;
        localStorage.removeItem(sessionKey(dayNum));
        renderSplit();
      });
      const submitBtn = document.getElementById('logger-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', () => {
          const sess = getSession(dayNum);
          // Commit history for every exercise that has any completed sets
          exercises.forEach(e => {
            const effId = (sess._swaps || {})[e.id] || e.id;
            const s = sess[effId];
            if (s && s.sets) commitHistory(effId, s.sets);
          });
          markCompleted(dayNum, { date: todayKey(), snapshot: sess });
          markRealLog(); // clears DEMO badge once any real workout is submitted
          renderSplit();
        });
      }
      const delBtn = document.getElementById('logger-delete');
      if (delBtn) {
        delBtn.addEventListener('click', () => {
          if (!confirm('Delete this logged workout? Sets stay in storage, just unlocks.')) return;
          deleteCompleted(dayNum);
          renderSplit();
        });
      }

      // Helper to ensure session slot exists for an exercise/set
      function ensureSetSlot(sess, exId, setIdx) {
        if (!sess[exId]) sess[exId] = { sets: [] };
        while (sess[exId].sets.length <= setIdx) sess[exId].sets.push({});
        return sess[exId].sets[setIdx];
      }

      // wt/reps inputs — save on change (no re-render to preserve focus)
      section.querySelectorAll('.set-input').forEach(inp => {
        inp.addEventListener('input', () => {
          const exId = inp.dataset.ex;
          const idx  = +inp.dataset.set;
          const field = inp.dataset.field;
          const sess = getSession(dayNum);
          const slot = ensureSetSlot(sess, exId, idx);
          // Normalize comma-decimal locales (72,5 → 72.5), reject negatives,
          // clamp absurdly large values for the weight field only.
          let raw = inp.value.replace(',', '.').trim();
          if (field === 'wt' && raw !== '') {
            const v = parseFloat(raw);
            if (Number.isFinite(v)) {
              raw = String(Math.max(0, Math.min(1000, v)));
            }
          } else if (field === 'reps' && raw !== '') {
            const r = parseInt(raw, 10);
            if (Number.isFinite(r)) raw = String(Math.max(0, Math.min(999, r)));
          }
          slot[field] = raw;
          saveSession(dayNum, sess);
        });
      });

      // ✓ check — toggle done, capture current OR placeholder values, commit history, fire timer
      section.querySelectorAll('.set-check-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (isSessionLocked(dayNum)) return; // workout is logged — locked
          const exId = btn.dataset.ex;
          const idx  = +btn.dataset.set;
          const sess = getSession(dayNum);
          const slot = ensureSetSlot(sess, exId, idx);
          // Capture latest input values from the DOM — fall back to placeholder so star can render
          const wtInp   = section.querySelector(`.set-input[data-ex="${exId}"][data-set="${idx}"][data-field="wt"]`);
          const repsInp = section.querySelector(`.set-input[data-ex="${exId}"][data-set="${idx}"][data-field="reps"]`);
          if (wtInp) {
            const typed = wtInp.value.replace(',', '.').trim();
            const fallback = wtInp.placeholder && wtInp.placeholder !== '—' ? wtInp.placeholder : '';
            slot.wt = typed || slot.wt || fallback || '';
          }
          if (repsInp) {
            const typed = repsInp.value.trim();
            const fallback = repsInp.placeholder && repsInp.placeholder !== '—' ? repsInp.placeholder : '';
            slot.reps = typed || slot.reps || fallback || '';
          }
          const wasUndone = !slot.done;
          // Reject ✓ when both fields are still blank (no reps placeholder either).
          // Pulse the empty field instead of silently logging a 0×0 row.
          if (wasUndone && (!slot.reps || parseInt(slot.reps, 10) <= 0)) {
            const target = repsInp || wtInp;
            if (target) {
              target.classList.add('set-input-pulse');
              setTimeout(() => target.classList.remove('set-input-pulse'), 600);
              target.focus();
            }
            return;
          }
          slot.done = !slot.done;
          if (slot.done) slot.missed = false;
          saveSession(dayNum, sess);
          commitHistory(exId, sess[exId].sets);
          // Only start the timer when transitioning to "done" AND not the very last set
          if (wasUndone && slot.done) {
            const ex = EX[exId];
            const targetSets = (exercises.find(x => x.id === exId)?.sets) || (ex && ex.sets) || 1;
            const isLastSet = (idx + 1) >= targetSets;
            if (!isLastSet) startRestTimer(optimalRestFor(exId, day.type), ex ? ex.name : null);
            else stopRestTimer();
          } else if (!slot.done) {
            stopRestTimer();
          }
          renderSplit();
        });
      });

      // × missed — toggle missed
      section.querySelectorAll('.set-miss-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (isSessionLocked(dayNum)) return; // workout is logged — locked
          const exId = btn.dataset.ex;
          const idx  = +btn.dataset.set;
          const sess = getSession(dayNum);
          const slot = ensureSetSlot(sess, exId, idx);
          slot.missed = !slot.missed;
          if (slot.missed) slot.done = false;
          saveSession(dayNum, sess);
          renderSplit();
        });
      });

      // LAST-row clock — open past-sessions list popover for this exercise
      section.querySelectorAll('.last-pencil').forEach(btn => {
        btn.addEventListener('click', () => {
          openSessionListPopover(btn.dataset.historyEx, dayNum);
        });
      });

      // Warm-up target input — typed value updates the grid live, persists on blur
      section.querySelectorAll('[data-wu-target]').forEach(inp => {
        inp.addEventListener('input', () => {
          if (isSessionLocked(dayNum)) return;
          const exId = inp.dataset.wuTarget;
          const wt = parseFloat(inp.value);
          const grid = section.querySelector(`[data-warmup-grid="${exId}"]`);
          if (!grid) return;
          const warmup = computeWarmup(wt, exId);
          if (warmup) {
            grid.innerHTML = warmup.map((w, i) =>
              `<div class="wu-tag">W${i+1}</div><div class="wu-wt">${fmtKg(w.w, exId)}</div><div class="wu-reps">×${w.reps}</div>`
            ).join('');
          } else {
            grid.innerHTML = '';
          }
        });
        inp.addEventListener('change', () => {
          if (isSessionLocked(dayNum)) return;
          // Only persist when this card is NOT a today-only swap — saving a
          // swapped warmup target to the slot would corrupt the slot's default
          // for the next session (when the original exercise returns).
          const slotId = inp.dataset.wuSlot;
          if (!slotId) return;
          const split = getSplit() || [];
          const dayConfig = split[dayNum - 1];
          if (!dayConfig) return;
          const entry = (dayConfig.exercises || []).find(x => x.id === slotId);
          if (entry) {
            entry.defaultWeight = inp.value.trim();
            saveSplit(split);
          }
        });
      });

      // i / ⇄ / ↗ action buttons
      section.querySelectorAll('.ex-action-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const exId = btn.dataset.ex;
          const action = btn.dataset.exAction;
          if (action === 'info')  openTipPopover(exId);
          if (action === 'swap')  openSwapPopover(dayNum, exId);
          if (action === 'chart') openHistoryPopover(exId, dayNum);
        });
      });

      // Tap-to-edit rest time (clickable "rest 3:30" in meta line)
      section.querySelectorAll('[data-rest-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          openRestEditPopover(btn.dataset.ex, dayNum);
        });
      });
    }

    // ── Tip / swap / history popovers ──────────────────────────────────────
    function openPopover(html) {
      const sheet = document.getElementById('popover-sheet');
      sheet.innerHTML = html + '<button class="popover-close" id="popover-close">Close</button>';
      document.getElementById('popover').classList.add('open');
      document.getElementById('popover-close').addEventListener('click', closePopover);
    }
    function closePopover() {
      document.getElementById('popover').classList.remove('open');
    }
    document.addEventListener('click', e => {
      if (e.target && e.target.id === 'popover') closePopover();
    });

    function openTailorModal() {
      const saved = getProfile() || {};
      // Internal state — height/weight always stored in metric, unit is display-only.
      const state = {
        age: saved.age ?? null,
        gender: saved.gender || 'm',
        heightCm: saved.height ?? null,
        weightKg: saved.weight ?? null,
        level: saved.level || 'int',
        weightUnit: saved.weightUnit || 'kg',
        heightUnit: saved.heightUnit || 'cm',
      };

      const cmToFt = cm => { const inches = cm / 2.54; return { ft: Math.floor(inches / 12), in: Math.round(inches % 12) }; };
      const ftToCm = (ft, inches) => Math.round((ft * 30.48) + ((inches || 0) * 2.54));
      const kgToLb = kg => Math.round(kg * 2.2046 * 10) / 10;
      const lbToKg = lb => Math.round(lb * 0.4536 * 10) / 10;

      function captureInputs() {
        const ageEl = document.getElementById('tailor-age');
        if (ageEl) state.age = parseInt(ageEl.value, 10) || null;
        if (state.heightUnit === 'ft') {
          const ftEl = document.getElementById('tailor-height-ft');
          const inEl = document.getElementById('tailor-height-in');
          const ft = parseInt(ftEl?.value, 10) || 0;
          const inches = parseInt(inEl?.value, 10) || 0;
          state.heightCm = (ft || inches) ? ftToCm(ft, inches) : null;
        } else {
          const cmEl = document.getElementById('tailor-height-cm');
          const cm = parseInt(cmEl?.value, 10);
          state.heightCm = isNaN(cm) ? null : cm;
        }
        const wEl = document.getElementById('tailor-weight');
        if (wEl) {
          const v = parseFloat(wEl.value);
          if (!isNaN(v)) state.weightKg = state.weightUnit === 'lb' ? lbToKg(v) : v;
          else if (wEl.value.trim() === '') state.weightKg = null;
        }
      }

      function render() {
        const ageVal = state.age != null ? state.age : '';
        const cmVal  = state.heightCm != null ? state.heightCm : '';
        const ftObj  = state.heightCm != null ? cmToFt(state.heightCm) : { ft: '', in: '' };
        const wDisp  = state.weightKg != null
          ? (state.weightUnit === 'lb' ? kgToLb(state.weightKg) : state.weightKg)
          : '';
        const wPh = state.weightUnit === 'lb' ? '160' : '72';

        const heightInputs = state.heightUnit === 'ft' ? `
          <input id="tailor-height-ft" type="text" inputmode="numeric" placeholder="5" value="${ftObj.ft}" maxlength="1" />
          <span class="tailor-suffix">ft</span>
          <input id="tailor-height-in" type="text" inputmode="numeric" placeholder="11" value="${ftObj.in}" maxlength="2" />
          <span class="tailor-suffix">in</span>
        ` : `
          <input id="tailor-height-cm" type="text" inputmode="numeric" placeholder="178" value="${cmVal}" maxlength="3" />
          <span class="tailor-suffix">cm</span>
        `;

        openPopover(`
          <div class="popover-title">Tailor your starting weights</div>
          <div class="popover-tip" style="margin-bottom:18px;">Quick profile → every exercise picks a sensible placeholder weight. Override anytime.</div>

          <div class="tailor-form">

            <div class="tailor-field">
              <div class="tailor-field-head"><span class="tailor-label">Age</span></div>
              <div class="tailor-input-wrap">
                <input id="tailor-age" type="text" inputmode="numeric" placeholder="21" value="${ageVal}" maxlength="3" />
                <span class="tailor-suffix">yrs</span>
              </div>
            </div>

            <div class="tailor-field">
              <div class="tailor-field-head"><span class="tailor-label">Gender</span></div>
              <div class="tailor-chips" data-chip-group="gender">
                <button class="tailor-chip${state.gender === 'm' ? ' active' : ''}" data-val="m">Male</button>
                <button class="tailor-chip${state.gender === 'f' ? ' active' : ''}" data-val="f">Female</button>
              </div>
            </div>

            <div class="tailor-field">
              <div class="tailor-field-head">
                <span class="tailor-label">Height</span>
                <div class="tailor-unit-toggle" data-unit-group="height">
                  <button class="tailor-unit-btn${state.heightUnit === 'cm' ? ' active' : ''}" data-val="cm">cm</button>
                  <button class="tailor-unit-btn${state.heightUnit === 'ft' ? ' active' : ''}" data-val="ft">ft + in</button>
                </div>
              </div>
              <div class="tailor-input-wrap">${heightInputs}</div>
            </div>

            <div class="tailor-field">
              <div class="tailor-field-head">
                <span class="tailor-label">Weight</span>
                <div class="tailor-unit-toggle" data-unit-group="weight">
                  <button class="tailor-unit-btn${state.weightUnit === 'kg' ? ' active' : ''}" data-val="kg">kg</button>
                  <button class="tailor-unit-btn${state.weightUnit === 'lb' ? ' active' : ''}" data-val="lb">lb</button>
                </div>
              </div>
              <div class="tailor-input-wrap">
                <input id="tailor-weight" type="text" inputmode="decimal" placeholder="${wPh}" value="${wDisp}" maxlength="6" />
                <span class="tailor-suffix">${state.weightUnit}</span>
              </div>
            </div>

            <div class="tailor-field">
              <div class="tailor-field-head"><span class="tailor-label">Gym level</span></div>
              <div class="tailor-chips tailor-chips-3" data-chip-group="level">
                <button class="tailor-chip${state.level === 'beg' ? ' active' : ''}" data-val="beg">
                  <span class="chip-title">Beginner</span>
                  <span class="chip-sub">0–6 mo</span>
                </button>
                <button class="tailor-chip${state.level === 'int' ? ' active' : ''}" data-val="int">
                  <span class="chip-title">Intermediate</span>
                  <span class="chip-sub">6 mo – 2 yr</span>
                </button>
                <button class="tailor-chip${state.level === 'adv' ? ' active' : ''}" data-val="adv">
                  <span class="chip-title">Advanced</span>
                  <span class="chip-sub">2+ yr</span>
                </button>
              </div>
            </div>

          </div>

          <div class="tailor-actions">
            ${getProfile() ? '<button class="tailor-clear" id="tailor-clear">Clear profile</button>' : ''}
            <button class="tailor-save" id="tailor-save">Apply estimates</button>
          </div>
        `);
        attachHandlers();
      }

      function attachHandlers() {
        // Chip groups
        document.querySelectorAll('[data-chip-group]').forEach(group => {
          const key = group.dataset.chipGroup;
          group.querySelectorAll('.tailor-chip').forEach(btn => {
            btn.addEventListener('click', () => {
              captureInputs();
              state[key] = btn.dataset.val;
              render();
            });
          });
        });
        // Unit toggles
        document.querySelectorAll('[data-unit-group]').forEach(group => {
          const key = group.dataset.unitGroup + 'Unit';
          group.querySelectorAll('.tailor-unit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              captureInputs();
              state[key] = btn.dataset.val;
              render();
            });
          });
        });
        // Save
        document.getElementById('tailor-save').addEventListener('click', () => {
          captureInputs();
          if (!state.weightKg) {
            (document.getElementById('tailor-weight'))?.focus();
            return;
          }
          saveProfile({
            age: state.age,
            gender: state.gender,
            height: state.heightCm,
            weight: state.weightKg,
            level: state.level,
            weightUnit: state.weightUnit,
            heightUnit: state.heightUnit,
          });
          maybeMarkSetupComplete();
          closePopover();
          renderSplit();
        });
        // Clear
        const clearBtn = document.getElementById('tailor-clear');
        if (clearBtn) clearBtn.addEventListener('click', () => {
          saveProfile(null);
          closePopover();
          renderSplit();
        });
      }

      render();
    }

    function openTipPopover(exId) {
      const ex = EX[exId];
      if (!ex) return;
      const tip = TIPS[exId] || 'No tip on file for this one yet.';
      openPopover(`
